# Trend radar on a GitHub runner, run by hand (Actions > trend-radar > Run workflow, or the API), one niche per run.
# TikTok creator pages work from runners without a login; the owner's Mac IP got rate-limited, and runner IPs can be too.
# This repo is public, so its run logs and artifacts are public. By default the log shows only counts and the results
# leave the runner encrypted with the RADAR_KEY secret (decrypt: references/trends.md). output=public skips the
# encryption and prints the ranked table: handles, titles and view counts, all of it public data.
name: trend-radar
on:
  workflow_dispatch:
    inputs:
      niche:
        description: "label for this run, e.g. money-scams"
        required: true
      handles:
        description: "TikTok handles, comma separated; '@h tiktokuser:<secUid>' for a bot-checked page (or use a watchlist file)"
        required: false
        default: ""
      watchlist:
        description: "a watchlist file in the repo, one handle per line (optional)"
        required: false
        default: ""
      per_creator:
        description: "recent videos per creator"
        default: "30"
      min_score:
        description: "breakout threshold, x the creator's median"
        default: "3"
      max_age_days:
        description: "rank only videos posted within this many days"
        default: "30"
      keywords:
        description: "niche words, comma separated: creators mostly off-niche are dropped (optional)"
        required: false
        default: ""
      output:
        description: "encrypted (default: counts only in the log) or public (table in the log, plain artifact)"
        type: choice
        options: [encrypted, public]
        default: encrypted
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NICHE: ${{ inputs.niche }}
      HANDLES: ${{ inputs.handles }}
      WATCHLIST: ${{ inputs.watchlist }}
      OUTPUT: ${{ inputs.output }}
      PER_CREATOR: ${{ inputs.per_creator }}
      MIN_SCORE: ${{ inputs.min_score }}
      MAX_AGE: ${{ inputs.max_age_days }}
      KEYWORDS: ${{ inputs.keywords }}
      RADAR_KEY: ${{ secrets.RADAR_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check inputs
        run: |
          case "$NICHE" in *[!a-zA-Z0-9_-]*|"") echo "::error::niche must be letters, digits, - or _"; exit 1;; esac
          case "$PER_CREATOR$MIN_SCORE$MAX_AGE" in *[!0-9.]*) echo "::error::per_creator and min_score must be numbers"; exit 1;; esac
          if [ "$OUTPUT" = encrypted ] && [ -z "$RADAR_KEY" ]; then
            echo "::error::output=encrypted needs the RADAR_KEY repository secret (Settings > Secrets and variables > Actions)"; exit 1
          fi
          echo "$HANDLES" | tr ',' '\n' | sed 's/^ *//; s/ *$//; /^$/d' > "$RUNNER_TEMP/watch.txt"
          if [ -n "$WATCHLIST" ]; then cat "$WATCHLIST" >> "$RUNNER_TEMP/watch.txt"; fi
          if [ ! -s "$RUNNER_TEMP/watch.txt" ]; then echo "::error::give handles or a watchlist"; exit 1; fi
      - run: python -m pip install -q -U yt-dlp
      - name: Scan
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          python plugin/skills/motion-studio/scripts/trends.py tiktok --watchlist "$RUNNER_TEMP/watch.txt" \
            --per-creator "$PER_CREATOR" --min-score "$MIN_SCORE" --max-age-days "$MAX_AGE" --keywords "$KEYWORDS" \
            --out "$RUNNER_TEMP/out" \
            > "$RUNNER_TEMP/out/stdout.txt" 2> "$RUNNER_TEMP/out/stderr.txt"
          rc=$?
          set -e
          python - <<'PY'
          import glob, json, os
          vids = [v for f in glob.glob(os.environ["RUNNER_TEMP"] + "/out/*.json") for v in json.load(open(f))]
          ms = float(os.environ["MIN_SCORE"])
          hits = [v for v in vids if (v.get("score") or 0) >= ms]
          creators = {v["creator"] for v in vids}
          print(f"::notice::{os.environ['NICHE']}: {len(vids)} videos from {len(creators)} creators, {len(hits)} breakouts at {ms}x or more")
          PY
          bot=$(grep -c '^  ! \[bot-check\]' "$RUNNER_TEMP/out/stderr.txt" || true)
          other=$(grep -c '^  ! \[other\]' "$RUNNER_TEMP/out/stderr.txt" || true)
          dropped=$(grep -c '^  dropped @' "$RUNNER_TEMP/out/stderr.txt" || true)
          echo "::notice::pages failed: $bot bot-checked, $other other; creators dropped as stale or off-niche: $dropped (exit $rc)"
          if [ "$OUTPUT" = public ]; then cat "$RUNNER_TEMP/out/stdout.txt" "$RUNNER_TEMP/out/stderr.txt"; fi
      - name: Encrypt
        if: inputs.output == 'encrypted'
        run: |
          tar -C "$RUNNER_TEMP/out" -czf "$RUNNER_TEMP/radar.tgz" .
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "$RUNNER_TEMP/radar-$NICHE.tgz.gpg" "$RUNNER_TEMP/radar.tgz" <<< "$RADAR_KEY"
          rm -rf "$RUNNER_TEMP/out" "$RUNNER_TEMP/radar.tgz"
      - uses: actions/upload-artifact@v4
        if: inputs.output == 'encrypted'
        with: {name: "radar-${{ inputs.niche }}", path: "${{ runner.temp }}/radar-${{ inputs.niche }}.tgz.gpg", retention-days: 7}
      - uses: actions/upload-artifact@v4
        if: inputs.output == 'public'
        with: {name: "radar-${{ inputs.niche }}", path: "${{ runner.temp }}/out", retention-days: 7}

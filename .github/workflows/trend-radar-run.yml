name: trend-radar-run
on:
  push:
    branches: [trend-radar-run]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -q yt-dlp
      - name: Diagnose
        continue-on-error: true
        run: |
          python - <<'PY'
          import yt_dlp
          for url in ["https://www.tiktok.com/tag/scam", "https://www.tiktok.com/@tiktok", "https://www.tiktok.com/@khaby.lame"]:
              try:
                  with yt_dlp.YoutubeDL({"quiet": True, "extract_flat": True, "playlistend": 5}) as y:
                      info = y.extract_info(url, download=False)
                  e = list(info.get("entries") or [])
                  print(f"::warning::OK {url}: {len(e)} entries; first views={e[0].get('view_count') if e else None} uploader={e[0].get('uploader') if e else None}")
              except Exception as ex:
                  print(f"::warning::FAIL {url}: {str(ex)[:400]}")
          PY
      - name: TikTok hashtags
        continue-on-error: true
        run: |
          for t in scam scamalert scamwarning; do
            python plugin/skills/motion-studio/scripts/trends.py tiktok-tag $t --videos 40 --per-creator 15 --min-score 2 --out research/trends 2>&1 | sed 's/^/::warning::/' || true
          done
          for f in research/trends/*.md; do [ -f "$f" ] && sed 's/^/::notice::/' "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: trends, path: research/trends, if-no-files-found: warn}

name: trend-radar-run
on:
  push:
    branches: [trend-radar-run]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -q yt-dlp
      - name: TikTok hashtags
        continue-on-error: true
        run: |
          for t in scam scamalert scamwarning; do
            python plugin/skills/motion-studio/scripts/trends.py tiktok-tag $t --videos 40 --per-creator 15 --min-score 2 --out research/trends || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: trends, path: research/trends, if-no-files-found: warn}

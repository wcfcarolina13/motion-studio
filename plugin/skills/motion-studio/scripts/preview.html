<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>motion-studio</title>
<style>
  :root { --bg: #111110; --panel: #181817; --line: #2e2e2c; --ink: #e8e6e1; --grey: #969691; --accent: #d9692b; --done: #5f7f5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 44px 1fr 118px; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  header .name { font-weight: 600; margin-right: 8px; }
  button, select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--grey); }
  button.on { border-color: var(--accent); color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; min-width: 190px; color: var(--grey); }
  #flash { margin-left: auto; color: var(--accent); opacity: 0; transition: opacity .3s; }
  #flash.show { opacity: 1; }
  #viewer { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; box-shadow: 0 0 0 1px var(--line); }
  #frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #0b0b0b; }
  #ink { position: absolute; inset: 0; cursor: crosshair; z-index: 2; }
  #ink .ring { position: absolute; border: 3px solid #ff5a1f; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.6), inset 0 0 0 2px rgba(0,0,0,.6); pointer-events: none; }
  #circled { color: var(--accent); }
  .note img { display: block; width: 100%; margin-top: 6px; border-radius: 4px; border: 1px solid var(--line); }
  .note.sel { border-color: var(--accent); }
  .note.off { opacity: .35; }
  .note .eye { float: right; background: none; border: 0; padding: 0 2px; color: var(--grey); font-size: 12px; }
  .note .eye:hover { color: var(--ink); }
  #ink .ring.saved { border-color: #ffd23f; border-style: dashed; }
  #ink .ring.saved.sel { border-style: solid; border-width: 4px; }
  #ink .tag { position: absolute; background: #ffd23f; color: #111; font: 600 11px/1 -apple-system, sans-serif; padding: 2px 5px; border-radius: 3px; pointer-events: none; transform: translateY(-100%); }
  .notesHead { display: flex; align-items: center; gap: 6px; margin: 12px 12px 6px; }
  .notesHead h2 { margin: 0; flex: 1; }
  .notesHead button { font-size: 11px; padding: 2px 7px; }
  .note .pending { color: var(--grey); font-size: 11px; margin-top: 4px; }
  aside { grid-row: 2 / 4; grid-column: 2; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--grey); margin: 12px 12px 6px; }
  #noteForm { padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
  #noteForm textarea { width: 100%; height: 64px; resize: vertical; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; }
  #noteForm .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: var(--grey); }
  #notes { overflow-y: auto; padding: 6px 12px 12px; flex: 1; }
  .note { border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; margin-bottom: 6px; cursor: pointer; }
  .note:hover { border-color: var(--grey); }
  .note .meta { color: var(--grey); font-size: 11px; margin-bottom: 2px; }
  .note.done { opacity: .55; }
  .note.done .meta::after { content: " · done"; color: var(--done); }
  .note .reply { color: var(--done); margin-top: 4px; font-size: 12px; }
  #timeline { grid-column: 1; border-top: 1px solid var(--line); position: relative; cursor: pointer; user-select: none; }
  #timeline svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .help { color: var(--grey); font-size: 11px; padding: 8px 12px; border-top: 1px solid var(--line); }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; font-size: 10px; }
  #timeline, #ink { touch-action: none; }
  /* the review dashboard: takes side by side, section states, the owner's lock */
  #takes { position: absolute; inset: 0; z-index: 5; background: rgba(12,12,11,.97); overflow-y: auto; padding: 14px; display: none; }
  #takes.show { display: block; }
  .grp { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .grp.waiting { border-color: #d4a017; }
  .grp h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .grp h3 span { color: var(--grey); font-weight: 400; }
  .row3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .take { border: 2px solid transparent; border-radius: 6px; padding: 4px; background: var(--panel); }
  .take.chosen { border-color: var(--done); }
  .take img, .take video { display: block; width: 100%; border-radius: 4px; background: #000; }
  .take .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; color: var(--grey); }
  .take .bar button.use { border-color: var(--accent); color: var(--accent); }
  .take.chosen .bar button.use { border-color: var(--done); color: var(--done); }
  #takesBtn.wait { border-color: #d4a017; color: #d4a017; }
  #section { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #section .st { font-weight: 600; }
  #section .why { color: var(--grey); font-size: 12px; margin: 2px 0 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; color: var(--grey); font-size: 11px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: 44px 52vh 96px auto; height: auto; min-height: 100vh; }
    header { grid-column: 1; overflow-x: auto; }
    aside { grid-row: 4; grid-column: 1; border-left: 0; border-top: 1px solid var(--line); }
    #clock { min-width: 0; }
    .help { display: none; }
    header button, header select { white-space: nowrap; flex: none; }
    #takesBtn { order: -1; }
  }
</style>
</head>
<body>
<header>
  <span class="name" id="name">motion-studio</span>
  <button id="barBack" title="previous bar ([)">⏮</button>
  <button id="play" title="play / pause (space)">▶</button>
  <button id="barFwd" title="next bar (])">⏭</button>
  <select id="speed" title="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select>
  <button id="loop" title="loop the current scene (L)">loop scene</button>
  <button id="mute" title="mute (M)">sound on</button>
  <span id="clock">0.00 s</span>
  <button id="takesBtn" title="pick among takes (T)" hidden>takes</button>
  <span id="flash">reloaded</span>
</header>
<div id="viewer"><div id="takes"></div><div id="frame"><iframe id="film"></iframe><div id="ink" title="drag to circle what's wrong; click to clear"></div></div></div>
<aside>
  <div id="section" hidden></div>
  <h2>Note at playhead</h2>
  <form id="noteForm">
    <textarea id="noteText" placeholder="Drag on the frame to circle what's wrong, then say what to change. e.g. this caption is unclear · hard cut here"></textarea>
    <div class="row"><span><span id="noteAt">at 0.00 s</span> <span id="circled"></span></span><span><button type="button" id="discard" title="drop this circle and text without saving (esc)" hidden>Discard</button> <button type="submit">Pin note ⏎</button></span></div>
  </form>
  <div class="notesHead"><h2>Notes</h2>
    <button id="showRings" class="on" title="show the circles of notes on this frame (O)">circles on frame</button>
    <button id="hideDone" title="hide notes marked done (D)">hide done</button></div>
  <div id="notes"></div>
  <div class="help"><kbd>space</kbd> play · <kbd>←</kbd><kbd>→</kbd> frame · <kbd>shift</kbd>+arrows beat · <kbd>[</kbd><kbd>]</kbd> bar · <kbd>n</kbd> note · drag on frame: circle · <kbd>esc</kbd> clear circle · click a note: jump + show it · ✓ done / ↺ reopen · 👁 hide/show a note · <kbd>O</kbd> circles · <kbd>D</kbd> done · <kbd>L</kbd> loop · <kbd>M</kbd> mute</div>
</aside>
<div id="timeline"><svg id="tl"></svg></div>
<script>
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const FPS = 30;
let info, W = null, DUR = 1, S = null, t = 0, playing = false, speed = 1, loop = false, muted = false;
let lastMtime = 0, clockStart = 0, tStart = 0, notes = [], lastNotes = "", scale = 1, region = null;
let selected = null, showRings = true, hideDone = false;
const hidden = new Set(JSON.parse(localStorage.getItem("ms-hidden-notes") || "[]"));   // per-browser, never written to notes.json
const saveHidden = () => { try { localStorage.setItem("ms-hidden-notes", JSON.stringify([...hidden])); } catch (e) {} };
const audio = new Audio();
audio.preload = "auto";

const beat = () => S ? 60 / S.bpm : null;
const bar = () => S ? 4 * 60 / S.bpm : null;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmt = x => x.toFixed(2) + " s";
function barBeat(x) {
  if (!S) return "";
  const B = bar(), bt = beat();
  return ` · bar ${Math.floor(x / B)} · beat ${Math.floor((x % B) / bt) + 1}`;
}
function sceneAt(x) { return S ? (S.scenes.find(s => x >= s.from && x < s.to) || null) : null; }

async function init() {
  info = await (await fetch("/api/info")).json();
  $("name").textContent = info.film;
  document.title = info.film + " · motion-studio";
  loadFilm(0);
  loadNotes(); loadReview();
  setInterval(poll, 1000);
  setInterval(loadNotes, 3000);
  setInterval(loadReview, 3000);
}

function loadFilm(keepT) {
  const f = $("film");
  f.onload = () => {
    W = f.contentWindow;
    DUR = W.DUR || 1;
    S = W.STUDIO || null;
    const st = W.document.getElementById("stage").getBoundingClientRect();
    const fw = S ? S.format.w : Math.round(st.width), fh = S ? S.format.h : Math.round(st.height);
    f.width = fw; f.height = fh; f.dataset.w = fw; f.dataset.h = fh;
    fit();
    drawTimeline();
    seek(keepT);
    if (S && S.warnings && S.warnings.length) S.warnings.forEach(w => console.warn("LINT:", w));
  };
  f.src = info.url + "?v=" + Date.now();
  if (info.mix) { audio.src = info.mix + "?v=" + Date.now(); audio.muted = muted; }
}

function fit() {
  const f = $("film"), v = $("viewer");
  const fw = +f.dataset.w || 1080, fh = +f.dataset.h || 1350;
  const s = Math.min((v.clientWidth - 24) / fw, (v.clientHeight - 24) / fh);
  scale = s;
  f.style.transform = `scale(${s})`;
  $("frame").style.width = fw * s + "px"; $("frame").style.height = fh * s + "px";
}
window.addEventListener("resize", () => { fit(); drawTimeline(); drawRing(); });

function seek(x) {
  setTimeout(drawRing, 0);
  t = clamp(x, 0, DUR - 1e-4);
  if (W && W.seek) W.seek(t);
  $("clock").textContent = fmt(t) + barBeat(t);
  $("noteAt").textContent = "at " + fmt(t) + barBeat(t);
  if (!playing && info && info.mix) audio.currentTime = t;
  drawPlayhead();
  if (rev.sections.length) { const sc = secAt(t); if (sc && sc.title !== renderSection.last) { renderSection.last = sc.title; renderSection(); } }
}

function play() {
  playing = true; $("play").textContent = "❚❚";
  tStart = t; clockStart = performance.now();
  if (info.mix) { audio.currentTime = t; audio.playbackRate = speed; audio.play().catch(() => {}); }
  if (W && W.play) W.play(t, speed);
  requestAnimationFrame(tick);
}
function pause() { playing = false; $("play").textContent = "▶"; audio.pause(); if (W && W.pause) W.pause(); }
function tick() {
  if (!playing) return;
  let x = info.mix && !audio.paused && speed === audio.playbackRate ? audio.currentTime : tStart + (performance.now() - clockStart) / 1000 * speed;
  const sc = loop ? sceneAt(tStart) : null;
  if (sc && x >= sc.to) { x = sc.from; tStart = x; clockStart = performance.now(); if (info.mix) audio.currentTime = x; }
  if (x >= DUR) { seek(DUR - 1e-4); pause(); return; }
  // A film backed by a video file (a review wrapper around a rendered cut) exposes play/pause/time: it plays natively
  // and is only corrected when it drifts. Seeking a video every frame forces a decode from the last keyframe each time
  // and freezes playback; films drawn in code keep the per-frame seek.
  t = x;
  if (W && W.play) { if (W.time && Math.abs(W.time() - t) > 0.3) W.play(t, speed); }
  else if (W && W.seek) W.seek(t);
  if (notes.some(n => n.region && Math.abs(n.t - t) < 0.6)) drawRing(); else if ($("ink").querySelector(".saved")) drawRing();
  $("clock").textContent = fmt(t) + barBeat(t);
  $("noteAt").textContent = "at " + fmt(t) + barBeat(t);
  drawPlayhead();
  requestAnimationFrame(tick);
}

async function poll() {
  try {
    const { mtime } = await (await fetch("/api/mtime")).json();
    if (lastMtime && mtime > lastMtime) {
      const was = playing; pause(); loadFilm(t);
      $("flash").classList.add("show"); setTimeout(() => $("flash").classList.remove("show"), 1200);
      if (was) setTimeout(play, 400);
    }
    lastMtime = mtime;
  } catch (e) {}
}

// ── timeline ─────────────────────────────────────────────
let playhead;
function x2t(px) { return px / $("timeline").clientWidth * DUR; }
function t2x(x) { return x / DUR * $("timeline").clientWidth; }
function drawTimeline() {
  const svg = $("tl"); svg.innerHTML = "";
  const w = $("timeline").clientWidth, h = $("timeline").clientHeight;
  const el = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  if (S) {
    S.scenes.forEach((s, i) => {
      el("rect", { x: t2x(s.from), y: 6, width: Math.max(0, t2x(s.to) - t2x(s.from) - 1), height: 26, fill: i % 2 ? "#232321" : "#1d1d1c" });
      const sec = rev.sections.find(x => x.title === s.name && Math.abs(x.t0 - s.from) < 0.05);
      if (sec) {   // the section's state as a band along the chapter's top, striped when it changed since his lock
        el("rect", { x: t2x(s.from), y: 6, width: Math.max(0, t2x(s.to) - t2x(s.from) - 1), height: 6, fill: (SEC[sec.state] || ["#555"])[0] });
        if (sec.stale) el("rect", { x: t2x(s.from), y: 12, width: Math.max(0, t2x(s.to) - t2x(s.from) - 1), height: 2, fill: "#d9692b" });
      }
      const lbl = el("text", { x: t2x(s.from) + 6, y: 23, fill: "#969691", "font-size": 11 }); lbl.textContent = s.name;
    });
    const B = bar(), bt = beat();
    for (let x = 0; x <= DUR + 1e-6; x += bt) {
      const isBar = Math.abs(x / B - Math.round(x / B)) < 1e-6;
      el("line", { x1: t2x(x), x2: t2x(x), y1: isBar ? 34 : 50, y2: 62, stroke: isBar ? "#5a5956" : "#333331" });
      if (isBar) { const n = el("text", { x: t2x(x) + 3, y: 46, fill: "#6d6c68", "font-size": 10 }); n.textContent = Math.round(x / B); }
    }
    (S.text || []).forEach(tx => {
      el("rect", { x: t2x(tx.t0), y: 66, width: Math.max(2, t2x(tx.t1 ?? DUR) - t2x(tx.t0)), height: 6, rx: 2, fill: tx.where === "caption" ? "#4a4a47" : "#3a3a38" });
    });
  } else {
    for (let x = 0; x <= DUR; x += 1) {
      el("line", { x1: t2x(x), x2: t2x(x), y1: x % 5 ? 50 : 34, y2: 62, stroke: "#444" });
      if (x % 5 === 0) { const n = el("text", { x: t2x(x) + 3, y: 46, fill: "#6d6c68", "font-size": 10 }); n.textContent = x + "s"; }
    }
  }
  notes.filter(n => !hidden.has(n.id) && !(hideDone && n.status === "done")).forEach(n => {
    const g = el("g", {});
    el("line", { x1: t2x(n.t), x2: t2x(n.t), y1: 76, y2: h - 6, stroke: n.status === "open" ? "#d9692b" : "#5f7f5a", "stroke-width": 2 });
    el("circle", { cx: t2x(n.t), cy: 80, r: 5, fill: n.status === "open" ? "#d9692b" : "#5f7f5a" });
  });
  playhead = el("line", { y1: 0, y2: h, stroke: "#e8e6e1", "stroke-width": 1.5 });
  drawPlayhead();
}
function drawPlayhead() { if (playhead) { const x = t2x(t); playhead.setAttribute("x1", x); playhead.setAttribute("x2", x); } }
let dragging = false;
$("timeline").addEventListener("pointerdown", e => { dragging = true; pause(); seek(x2t(e.clientX - $("timeline").getBoundingClientRect().left)); });
window.addEventListener("pointermove", e => { if (dragging) seek(x2t(e.clientX - $("timeline").getBoundingClientRect().left)); });
window.addEventListener("pointerup", () => { dragging = false; });

// ── notes ────────────────────────────────────────────────
async function loadNotes() {
  let fresh;
  try { fresh = (await (await fetch("/api/notes")).json()).notes; } catch (e) { return; }
  if (JSON.stringify(fresh) === lastNotes) return;      // unchanged: don't rebuild (and re-fetch every still)
  lastNotes = JSON.stringify(fresh); notes = fresh;
  renderNotes();
}
function renderNotes() {
  const box = $("notes"); box.innerHTML = "";
  [...notes].sort((a, b) => a.t - b.t).filter(n => !(hideDone && n.status === "done")).forEach(n => {
    const d = document.createElement("div");
    d.className = "note" + (n.status === "done" ? " done" : "") + (selected === n.id ? " sel" : "") + (hidden.has(n.id) ? " off" : "");
    d.innerHTML = `<div class="meta">#${n.id} · ${fmt(n.t)}${n.where ? " · " + n.where : ""}</div><div></div>` + (n.reply ? `<div class="reply"></div>` : "");
    d.children[1].textContent = n.text; if (n.reply) d.children[2].textContent = "↳ " + n.reply;
    if (n.still) { const im = document.createElement("img"); im.src = `/w/${encodeURIComponent(info.film)}/${n.still}?v=${n.id}`; im.alt = "frame " + n.id; im.title = "open the full still";
      im.onclick = ev => { ev.stopPropagation(); window.open(im.src, "_blank"); }; d.appendChild(im); }
    else if (n.still_error) { const e = document.createElement("div"); e.className = "pending"; e.textContent = "no still: " + n.still_error; d.appendChild(e); }
    else if (n.status === "open") { const e = document.createElement("div"); e.className = "pending"; e.textContent = "saving the frame…"; d.appendChild(e); }
    d.onclick = () => { pause(); selected = selected === n.id ? null : n.id; if (selected) { hidden.delete(n.id); saveHidden(); seek(n.t); } renderNotes(); drawRing(); };
    const eye = document.createElement("button"); eye.className = "eye"; eye.textContent = hidden.has(n.id) ? "◌" : "👁";
    eye.title = hidden.has(n.id) ? "show this note's circle and marker" : "hide this note's circle and marker";
    eye.onclick = ev => { ev.stopPropagation(); hidden.has(n.id) ? hidden.delete(n.id) : hidden.add(n.id); saveHidden(); renderNotes(); drawRing(); };
    d.children[0].prepend(eye);
    const tick = document.createElement("button"); tick.className = "eye";
    tick.textContent = n.status === "done" ? "↺" : "✓";
    tick.title = n.status === "done" ? "reopen this note" : "mark this note done";
    tick.onclick = async ev => {
      ev.stopPropagation();
      await fetch(`/api/notes/${n.id}/${n.status === "done" ? "open" : "done"}`, { method: "POST" });
      loadNotes();
    };
    d.children[0].prepend(tick);
    box.appendChild(d);
  });
  drawTimeline(); drawRing();
}
$("noteForm").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("noteText").value.trim();
  if (!text) return;
  const sc = sceneAt(t);
  await fetch("/api/notes", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ t, text, region, where: (sc ? sc.name : "") + barBeat(t).replace(" · ", " ") }) });
  $("noteText").value = ""; $("noteText").blur(); setRegion(null); loadNotes();
});
$("noteText").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("noteForm").requestSubmit(); } });

// ── circling on the frame ────────────────────────────────
// region is in film pixels (the frame's own size), so it means the same thing at any window size
function setRegion(r) { region = r; $("circled").textContent = r ? "· circled" : ""; drawRing(); syncDiscard(); }
// a draft is a circle and/or typed text not yet pinned; Discard (or esc) drops both
const hasDraft = () => !!region || $("noteText").value.trim() !== "";
function syncDiscard() { $("discard").hidden = !hasDraft(); }
function discardDraft() { $("noteText").value = ""; $("noteText").blur(); setRegion(null); }
$("discard").onclick = discardDraft;
$("noteText").addEventListener("input", syncDiscard);
function drawRing() {
  const ink = $("ink"); ink.querySelectorAll(".ring, .tag").forEach(e => e.remove());
  const ring = (r, cls, label) => {
    const d = document.createElement("div"); d.className = "ring" + cls;
    Object.assign(d.style, { left: r.x * scale + "px", top: r.y * scale + "px", width: r.w * scale + "px", height: r.h * scale + "px" });
    ink.appendChild(d);
    if (label) { const g = document.createElement("div"); g.className = "tag"; g.textContent = label; g.style.left = r.x * scale + "px"; g.style.top = r.y * scale + "px"; ink.appendChild(g); }
  };
  // a note's circle shows only while the playhead is within half a second of it; leaving that window drops the selection
  const near = n => Math.abs(n.t - t) <= 0.5;
  if (selected !== null && !notes.some(n => n.id === selected && near(n))) {
    selected = null; document.querySelectorAll(".note.sel").forEach(e => e.classList.remove("sel"));
  }
  notes.forEach(n => {
    if (!n.region || hidden.has(n.id) || (hideDone && n.status === "done")) return;
    const sel = selected === n.id;
    if ((sel && near(n)) || (showRings && near(n))) ring(n.region, " saved" + (sel ? " sel" : ""), "#" + n.id);
  });
  if (region) ring(region, "", "");
}
let drawFrom = null;
$("ink").addEventListener("pointerdown", e => {
  e.preventDefault(); pause();
  const b = $("ink").getBoundingClientRect();
  drawFrom = { x: e.clientX - b.left, y: e.clientY - b.top };
});
window.addEventListener("pointermove", e => {
  if (!drawFrom) return;
  const b = $("ink").getBoundingClientRect();
  const x = clamp(e.clientX - b.left, 0, b.width), y = clamp(e.clientY - b.top, 0, b.height);
  region = { x: Math.min(x, drawFrom.x) / scale, y: Math.min(y, drawFrom.y) / scale, w: Math.abs(x - drawFrom.x) / scale, h: Math.abs(y - drawFrom.y) / scale };
  drawRing();
});
window.addEventListener("pointerup", () => {
  if (!drawFrom) return;
  drawFrom = null;
  if (!region || region.w * scale < 6 || region.h * scale < 6) { setRegion(null); return; }   // a click clears
  setRegion({ x: Math.round(region.x), y: Math.round(region.y), w: Math.round(region.w), h: Math.round(region.h) });
  $("noteText").focus();
});

// ── review: takes, section states, the owner's lock ──────
// Picks and locks are the owner's clicks, saved by the server (picks.json, review/state.json); agents never make them.
const SEC = { locked: ["#5f7f5a", "locked"], not_started: ["#3a3a38", "not started"], takes: ["#d4a017", "takes to pick"],
              review: ["#d9692b", "open notes"], in_progress: ["#4f6d8a", "in progress"], ready: ["#3f8f8f", "ready to lock"] };
let rev = { groups: [], sections: [] }, lastRev = "";
async function loadReview() {
  let fresh;
  try { fresh = await (await fetch("/api/review")).json(); } catch (e) { return; }
  const j = JSON.stringify(fresh);
  if (j === lastRev) return;
  lastRev = j; rev = fresh;
  const wait = rev.groups.filter(g => g.pick == null).length;
  $("takesBtn").hidden = !rev.groups.length;
  $("takesBtn").textContent = wait ? `takes · ${wait} to pick` : `takes · all picked`;
  $("takesBtn").classList.toggle("wait", wait > 0);
  if ($("takes").classList.contains("show")) renderTakes();
  drawTimeline(); renderSection();
}
const secAt = x => rev.sections.find(s => x >= s.t0 && x < s.t1) || null;
function renderSection() {
  const box = $("section"), s = secAt(t);
  box.hidden = !rev.sections.length;
  if (!s) { box.innerHTML = ""; return; }
  const [col, name] = SEC[s.state] || ["#555", s.state];
  box.innerHTML = `<h2 style="margin:0 0 4px">Section</h2><div class="st"></div><div class="why"></div><button id="lockBtn"></button>
    <div class="legend" style="margin-top:8px">${Object.values(SEC).map(([c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>`;
  box.querySelector(".st").innerHTML = `<i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${col}"></i> `;
  box.querySelector(".st").append(s.title + " · " + name + (s.stale ? " (changed since)" : ""));
  box.querySelector(".why").textContent = s.why;
  const b = box.querySelector("#lockBtn"), on = s.state === "locked";
  b.textContent = on ? (s.stale ? "re-lock as it is now" : "unlock section") : "lock section";
  b.onclick = async () => {
    await fetch("/api/lock", { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify({ title: s.title, locked: !on || !!s.stale }) });
    lastRev = ""; loadReview();
  };
}
function renderTakes() {
  const box = $("takes"); box.innerHTML = "";
  const head = document.createElement("div"); head.style.cssText = "display:flex;gap:8px;align-items:center;margin-bottom:12px";
  head.innerHTML = `<b style="flex:1">Takes: mark the one to use</b><button id="takesClose">close (T)</button>`;
  box.appendChild(head); head.querySelector("#takesClose").onclick = () => toggleTakes(false);
  [...rev.groups].sort((a, b) => (a.pick != null) - (b.pick != null) || (a.t0 ?? 0) - (b.t0 ?? 0)).forEach(g => {
    const d = document.createElement("div"); d.className = "grp" + (g.pick == null ? " waiting" : "");
    const h = document.createElement("h3");
    h.append(g.shot + " "); const sp = document.createElement("span");
    sp.textContent = `${g.kind === "clip" ? "clip" : "still"} · ${g.takes.length} takes · ${g.segments.join(", ")}` + (g.t0 != null ? ` · ${fmt(g.t0)}` : "") + (g.pick == null ? " · waiting for your pick" : "");
    h.appendChild(sp);
    if (g.t0 != null) { const go = document.createElement("button"); go.textContent = "go to shot"; go.style.marginLeft = "8px";
      go.onclick = () => { toggleTakes(false); pause(); seek(g.t0 + 0.01); }; h.appendChild(go); }
    d.appendChild(h);
    const row = document.createElement("div"); row.className = "row3";
    g.takes.forEach(tk => {
      const c = document.createElement("div"); c.className = "take" + (g.pick === tk.seed ? " chosen" : "");
      const src = `/w/${encodeURIComponent(info.film)}/${tk.path.split("/").map(encodeURIComponent).join("/")}`;
      const m = document.createElement(g.kind === "clip" ? "video" : "img");
      if (g.kind === "clip") { m.controls = true; m.muted = true; m.playsInline = true; m.preload = "metadata"; } else m.loading = "lazy";
      m.src = src; c.appendChild(m);
      const bar = document.createElement("div"); bar.className = "bar";
      bar.innerHTML = `<span>seed ${tk.seed}</span>`;
      const use = document.createElement("button"); use.className = "use";
      use.textContent = g.pick === tk.seed ? "✓ chosen (undo)" : "use this";
      use.onclick = async () => {
        await fetch("/api/picks", { method: "POST", headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ key: g.key, seed: g.pick === tk.seed ? null : tk.seed }) });
        lastRev = ""; loadReview();
      };
      bar.appendChild(use); c.appendChild(bar); row.appendChild(c);
    });
    d.appendChild(row); box.appendChild(d);
  });
}
function toggleTakes(on) { $("takes").classList.toggle("show", on); if (on) { pause(); renderTakes(); } }
$("takesBtn").onclick = () => toggleTakes(!$("takes").classList.contains("show"));

// ── controls ─────────────────────────────────────────────
$("showRings").onclick = () => { showRings = !showRings; $("showRings").classList.toggle("on", showRings); drawRing(); };
$("hideDone").onclick = () => { hideDone = !hideDone; $("hideDone").classList.toggle("on", hideDone); renderNotes(); };
$("play").onclick = () => playing ? pause() : play();
$("barBack").onclick = () => { pause(); const B = bar() || 1; seek(Math.max(0, Math.ceil(t / B - 1e-6) - 1) * B); };
$("barFwd").onclick = () => { pause(); const B = bar() || 1; seek(Math.floor(t / B + 1e-6 + 1) * B); };
$("speed").onchange = e => { speed = +e.target.value; if (playing) { pause(); play(); } };
$("loop").onclick = () => { loop = !loop; $("loop").classList.toggle("on", loop); };
$("mute").onclick = () => { muted = !muted; audio.muted = muted; $("mute").textContent = muted ? "muted" : "sound on"; $("mute").classList.toggle("on", muted); };
window.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") { if (e.key === "Escape") discardDraft(); return; }
  if (e.key === "Escape") { selected = null; discardDraft(); renderNotes(); return; }
  const step = e.shiftKey ? (beat() || 0.5) : 1 / FPS;
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "t" || e.key === "T") { if (rev.groups.length) toggleTakes(!$("takes").classList.contains("show")); }
  else if (e.key === "ArrowRight") { pause(); seek(t + step); }
  else if (e.key === "ArrowLeft") { pause(); seek(t - step); }
  else if (e.key === "]") $("barFwd").onclick();
  else if (e.key === "[") $("barBack").onclick();
  else if (e.key === "n") { e.preventDefault(); pause(); $("noteText").focus(); }
  else if (e.key === "l" || e.key === "L") $("loop").onclick();
  else if (e.key === "o" || e.key === "O") $("showRings").onclick();
  else if (e.key === "d" || e.key === "D") $("hideDone").onclick();
  else if (e.key === "m" || e.key === "M") $("mute").onclick();
});
init();
</script>
</body>

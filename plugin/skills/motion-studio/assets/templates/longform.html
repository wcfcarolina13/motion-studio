<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Long-form film</title>
<style>
  html, body { margin: 0; padding: 0; }
  #stage { position: relative; overflow: hidden; }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg"><defs></defs><g id="world"></g><g id="top"></g></svg>
<div id="caps"></div>
</div>
<script src="kit.js"></script>
<script src="figure.js"></script>
<script src="timeline.js"></script>
<script>
// Long-form engine: a narrated film is a list of segments (timeline.js, written by longform.py from the
// script and the measured narration). Each segment has a scene type; every style is a pure function of t.
const TL = window.TIMELINE;
K.setup({ format: TL.format || "16x9", bpm: 60, bars: Math.ceil(TL.duration / 4), title: TL.title,
          palette: TL.palette || {} });
K.DUR = TL.duration; window.STUDIO.duration = TL.duration;
const C = K.C, W = K.W, H = K.H;
// 9:16 (a Short re-laid-out from a long-form film): the platform's UI covers the bottom ~22% and a right rail, so
// each scene keeps what must be read inside SAFE, and the burned-in captions sit just under it.
const VERT = H > W;
const SAFE = VERT ? { x0: 60, x1: 960, y0: 220, y1: 1220 } : { x0: 0, x1: W, y0: 0, y1: H };
const SH = SAFE.y1 - SAFE.y0, SMID = (SAFE.y0 + SAFE.y1) / 2;
const V = (wide, tall) => VERT ? tall : wide;      // one layout number per format
const SEGS = TL.segments;
const FONT = "Georgia, serif", SANS = "Helvetica Neue, Helvetica, Arial, sans-serif";
// reading size: anything the viewer must read is at least READ px (`check --min-text` measures it on the frame). A 16:9 video
// on a phone held upright is about 6.5 cm wide, so 56 px of 1920 is about 11 pt. "type_scale" in script.json scales it per film.
// Text marked AUX (chapter and source lines, kickers, attributions) is a label the viewer need not read, and is exempt.
const TS = TL.type_scale || 1, READ = Math.round(V(56, 40) * TS), AUX = { "data-aux": 1 };
const pitch = (size, k = 1.22) => Math.round(size * k);        // line pitch for a size
const fit = (px, size, k = 0.55) => Math.max(6, Math.floor(px / (size * k)));   // characters per line that fit px at size (SANS ~0.55 em)

// chapters show in the preview timeline
(TL.chapters || []).forEach(ch => window.STUDIO.scenes.push({ name: ch.title, from: ch.t0, to: ch.t1 }));

// ── layers ───────────────────────────────────────────────
const bgG = K.group("bg");
const dots = [];
{ const r = K.rng(11);
  for (let i = 0; i < 70; i++) dots.push({ x: r() * W, y: r() * H, s: 1 + r() * 2.2, v: 4 + r() * 10, el: K.el("circle", { fill: "#2a2a28" }, bgG) }); }
const sceneG = K.group("scenes");
const overlayG = K.group("overlay");   // per-segment text that must not move with a scene's camera (s.ov)
const footG = K.group("foot");
const sourceT = K.text("", { ...AUX, "font-family": SANS, "font-size": V(20, 24), fill: C.GREY, x: 60, y: V(H - 36, SAFE.y0 - 50) }, footG);
const chapterT = K.text("", { ...AUX, "font-family": SANS, "font-size": 20, fill: C.GREY, x: W - 60, y: 52, "text-anchor": "end", "letter-spacing": 3 }, footG);

// ── helpers ──────────────────────────────────────────────
const clipN = { n: 0 };
function maskText(str, attrs, parent) {           // text that rises out of its own mask line
  const id = "m" + (clipN.n++);
  const clip = K.clipRect(id);
  const g = K.el("g", { "clip-path": `url(#${id})` }, parent);
  const t = K.text(str, Object.assign({ "font-family": FONT }, attrs), g);
  return { g, t, clip, size: +attrs["font-size"] || 40 };
}
function placeMask(m, x, y, p, anchor) {          // p: 0 hidden below line → 1 risen
  const s = m.size;
  K.set(m.clip, { x: -50, y: y - s * 1.05, width: W + 100, height: s * 1.35 });
  K.set(m.t, { x, y: y + (1 - p) * s * 1.3, "text-anchor": anchor || "middle" });
}
function wrapWords(str, maxChars) {
  const words = String(str).split(/\s+/), lines = [];
  let cur = "";
  words.forEach(w => { if ((cur + " " + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
  if (cur) lines.push(cur);
  return lines;
}
// data items may be plain strings or {text, at}; an item with "at" was timed to its word by longform.py (item.t)
function txt(x) { return typeof x === "string" ? x : (x && x.text) || ""; }
function cueT(x, fallback) { return x && typeof x === "object" && x.t != null ? x.t - 0.05 : fallback; }
// the word clock for hand-built scenes: when is `phrase` said in segment s (nth occurrence)?
function said(s, phrase, nth = 1) {
  const norm = w => w.toLowerCase().replace(/[’]/g, "'").replace(/[^a-z0-9']/g, "");
  const want = phrase.split(/\s+/).map(norm), ws = s.words || [];
  let hits = 0;
  for (let i = 0; i + want.length <= ws.length; i++)
    if (want.every((w, k) => norm(ws[i + k][0]) === w || (k === want.length - 1 && norm(ws[i + k][0]).startsWith(w))) && ++hits === nth) return ws[i][1];
  window.STUDIO.warnings.push(`said(): "${phrase}" not found in ${s.id}`);
  return s.t0 + 0.5;
}
// camera keys from event times: sorted, at least `gap` s apart, so the camera never jumps between two keys at once.
// No glide averages more than `vmax` screen px/s (the eased peak is 3x that): a longer move glides longer, up to `gmax` s
// (the Trapdoor kit's limit, 2026-10-24; a 2,400 px whip in 0.9 s smeared). Values are screen px: the engine's callers hold z at 1; a kit camera at zoom z passes vmax / z
const CAM_VMAX = 1300, CAM_GMAX = 2.2;
function camKeys(t0, v0, evs, gap = 0.8, glide = 0.9, vmax = CAM_VMAX, gmax = CAM_GMAX) {
  const keys = [[t0, v0]];
  evs.slice().sort((a, b) => a[0] - b[0]).forEach(([t, v]) => {
    const last = keys[keys.length - 1];
    if (t < last[0] + gap) { if (t <= last[0] + 1e-6 && keys.length > 1) { last[1] = v; return; } t = last[0] + gap; }
    keys.push([t, v]);
  });
  // hold, then glide into each key over at most `glide` s. Easing across a long gap crawls at a fraction of a pixel per frame,
  // and with the camera on whole pixels (so text keeps its shape) that crawl shows as a one-pixel stutter. A glide that needs
  // more time than the gap since the last key starts at that key and lands late, rather than whip
  const out = [keys[0]];
  for (let i = 1; i < keys.length; i++) {
    let [t, v] = keys[i];
    const [tp, vp] = out[out.length - 1], need = Math.max(glide, Math.min(gmax, Math.abs(v - vp) / vmax));
    if (t - need > tp + 1e-6) out.push([t - need, vp]);
    else t = Math.max(t, tp + need);
    out.push([t, v]);
  }
  return out;
}
function fmtNum(v, dec) { return v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
// enter/leave envelope for a segment: in over 0.45 s, out over 0.3 s (a push, not a fade)
function env(t, s) { return { i: K.eout(K.prog(t, s.t0, s.t0 + 0.45)), o: K.ein(K.prog(t, s.t1 - 0.3, s.t1)), p: K.prog(t, s.t0, s.t1) }; }
// stagger: item k of n reveals across the first `span` of the segment
function revealAt(s, k, n, span = 0.7, lead = 0.35) { return s.t0 + lead + (s.t1 - s.t0 - lead) * span * (n <= 1 ? 0 : k / (n - 1)); }

// ── scene builders: build(seg, group) returns render(t) ──
const B = {};

B.chapter = (s, g) => {
  const num = maskText(s.data.kicker || "", { ...AUX, "font-family": SANS, "font-size": 30, fill: C.ACCENT, "letter-spacing": 6 }, g);
  const lh = V(110, 118), lines = wrapWords(s.data.title, V(26, 13)).map(l => maskText(l, { "font-size": V(92, 100), fill: C.INK }, g));
  const rule = K.el("rect", { fill: C.ACCENT }, g);
  K.label(s.data.title, s.t0, s.t1, "chapter card");
  return t => {
    const e = env(t, s), y0 = SMID - (lines.length - 1) * lh / 2;
    placeMask(num, W / 2, y0 - 110, K.eout(K.prog(t, s.t0, s.t0 + 0.4)) * (1 - e.o));
    lines.forEach((m, k) => placeMask(m, W / 2, y0 + k * lh, K.eout(K.prog(t, s.t0 + 0.12 + k * 0.1, s.t0 + 0.55 + k * 0.1)) * (1 - e.o)));
    const rw = 220 * K.eio(K.prog(t, s.t0 + 0.2, s.t0 + 0.9)) * (1 - e.o);
    K.set(rule, K.rect(W / 2 - rw / 2, y0 + lines.length * lh - 50, rw, 5, 2));
  };
};

B.statement = (s, g) => {
  const items = (s.data.lines || wrapWords(s.data.text, V(30, 16))), lines = items.map(txt);
  const acc = s.data.accent || [], size = s.data.size || V(76, 84);
  const ms = lines.map((l, k) => maskText(l, { "font-size": size, fill: acc.includes(k) ? C.ACCENT : C.INK }, g));
  ms.forEach(m => K.label(m.t.textContent, s.t0, s.t1, "statement"));
  const lh = size * 1.3;
  return t => {
    const e = env(t, s), y0 = V(H * 0.46, SMID) - (lines.length - 1) * lh / 2;
    ms.forEach((m, k) => {
      const tk = cueT(items[k], revealAt(s, k, lines.length, s.data.span || 0.45, 0.1));
      placeMask(m, W / 2, y0 + k * lh, K.eout(K.prog(t, tk, tk + 0.35)) * (1 - e.o));
    });
  };
};

// data: { left: {title, icon?, items: [text | {text, at}]}, right: {…same}, strike?: true (cross out a left item as its
//         right item lands, for "instead of" pairs), accent?: "left"|"right" (default right) }
// Both columns are up within the first second (icon and heading), and their items land row by row, left then right, so the
// viewer compares pairs with both sides on screen for most of the segment. icon: a name from ICONS (phone, bank, card, person,
// money, web, doc, x, check); it sits in a ring above the heading. color: "red", "green" or a hex colours that side's ring, icon
// and heading (red and green come from the palette's RED and GREEN when it has them); fill: true draws a solid disc with the
// icon cut out in white, the boldest form, for a do/don't pair: {icon: "x", color: "red", fill: true} | {icon: "check", color: "green", fill: true}.
B.compare = (s, g) => {
  const d = s.data, L = d.left, R = d.right, acc = d.accent === "left" ? 0 : 1;
  const IS = Math.round(V(62, 46) * TS), IL = pitch(IS, 1.2), HS = Math.max(READ, Math.round(V(44, 34) * TS));
  const colW = V(W * 0.4, SAFE.x1 - SAFE.x0 - 80);
  const col = (side, k) => {
    const hot = k === acc, ink = hot ? C.INK : C.GREY;
    const tone = TONES[side.color] || side.color || (hot ? C.ACCENT : C.GREY), mark = side.icon === "x" || side.icon === "check";
    const ring = side.icon ? K.el("circle", side.fill ? { fill: tone } : { fill: "none", stroke: tone, "stroke-width": 4 }, g) : null;
    const icon = side.icon ? K.el("path", { d: ICONS[side.icon] || ICONS.doc, fill: "none", stroke: side.fill ? "#fff" : tone, "stroke-width": mark ? 7 : 3.5,
                                            "stroke-linejoin": "round", "stroke-linecap": "round" }, g) : null;
    const head = maskText(side.title, { "font-family": SANS, "font-weight": 700, "font-size": HS, fill: tone, "letter-spacing": 3 }, g);
    const items = side.items.map(x => wrapWords(txt(x), fit(colW, IS, 0.5)).map(l => maskText(l, { "font-size": IS, fill: ink }, g)));
    return { side, ring, icon, head, items };
  };
  const cols = [col(L, 0), col(R, 1)], n = Math.max(L.items.length, R.items.length);
  const div = K.el("rect", { fill: "#2c2c2a" }, g);
  const strikes = d.strike ? cols[0].items.map(ms => ms.map(() => K.el("rect", { fill: C.ACCENT, "data-over": 1 }, g))) : [];   // one line per wrapped line; meant to cross text (data-over: check's overlap test skips it)
  [L.title, R.title, ...L.items, ...R.items].forEach(x => K.label(txt(x), s.t0, s.t1, "two columns"));
  const hasIcon = !!(L.icon || R.icon);
  // row k's height is its taller side
  const rowH = [...Array(n)].map((_, k) => Math.max(1, ...cols.map(c => (c.items[k] || []).length)) * IL + V(34, 24));
  // reveal times: row k left, then row k right, across the first 70% of the segment unless cued
  const T = cols.map((c, ci) => c.side.items.map((x, k) => cueT(x, revealAt(s, 2 * k + ci, 2 * n, 0.7, 0.9))));
  return t => {
    // wide: two columns side by side; tall: the left column above the right, split by a rule
    const e = env(t, s), o = 1 - e.o, iconH = hasIcon ? V(160, 120) : 0;
    const colH = HS + 40 + rowH.reduce((a, b) => a + b, 0);
    const xs = V([W * 0.27, W * 0.73], [W / 2, W / 2]);
    const top = V(Math.max(120, (H - colH - iconH) / 2 + 20), 0);
    const ys = V([top + iconH, top + iconH], [SAFE.y0 + 30 + iconH, SMID + 50 + iconH]);
    const dp = K.eio(K.prog(t, s.t0, s.t0 + 0.8)) * o;
    K.set(div, VERT ? K.rect(W / 2 - (W - 240) * dp / 2, SMID, (W - 240) * dp, 2) : K.rect(W / 2 - 1, top, 2, (H - 2 * top) * dp));
    cols.forEach((c, ci) => {
      const x = xs[ci], y = ys[ci], h0 = s.t0 + 0.15 * ci;
      const ip = Math.min(1.1, K.step(t, h0, 14, 0.6)) * o;
      if (c.ring) { K.set(c.ring, { cx: x, cy: y - iconH / 2 - 20, r: Math.max(0, V(48, 38) * ip) });
        c.icon.setAttribute("transform", `translate(${x} ${y - iconH / 2 - 20}) scale(${Math.max(0, V(1.3, 1.05) * ip)})`); }
      placeMask(c.head, x, y + HS * 0.4, K.eout(K.prog(t, h0 + 0.1, h0 + 0.5)) * o);
      let ry = y + HS + 40 + IS * 0.8;
      for (let k = 0; k < n; k++) {
        const ms = c.items[k] || [], tk = T[ci][k];
        ms.forEach((m, j) => placeMask(m, x, ry + j * IL, K.eout(K.prog(t, tk + j * 0.06, tk + 0.35 + j * 0.06)) * o));
        if (ci === 1 && strikes[k]) {
          const y0 = VERT ? ys[0] + HS + 40 + IS * 0.8 + rowH.slice(0, k).reduce((a, b) => a + b, 0) : ry, sp = K.eio(K.prog(t, tk - 0.2, tk + 0.2)) * o;
          cols[0].items[k].forEach((m, j) => { const bb = m.t.getComputedTextLength();
            K.set(strikes[k][j], K.rect(xs[0] - bb / 2, y0 + j * IL - IS * 0.3, bb * sp, 4)); });
        }
        ry += rowH[k];
      }
    });
  };
};

B.stat = (s, g) => {
  const d = s.data;
  const full = (d.prefix || "") + fmtNum(d.value, d.decimals || 0) + (d.suffix || "");
  const big = maskText("", { "font-size": V(200, Math.min(200, Math.floor(1450 / full.length))), fill: C.ACCENT }, g);   // tall: the number fits the width
  const LS = Math.max(READ, Math.round(50 * TS)), NS = READ;
  const lab = wrapWords(d.label, fit(V(1500, SAFE.x1 - SAFE.x0 - 40), LS, 0.5)).map(l => maskText(l, { "font-size": LS, fill: C.INK }, g));
  // notes: [{text, at}] — follow-up lines that land on their words under the label, so a long stat scene keeps moving
  const notes = (d.notes || []).map(x => ({ x, ms: wrapWords(txt(x), fit(V(1500, SAFE.x1 - SAFE.x0 - 40), NS)).map(l => maskText(l, { "font-family": SANS, "font-size": NS, fill: C.GREY }, g)) }));
  K.label((d.prefix || "") + fmtNum(d.value, d.decimals || 0) + (d.suffix || "") + " " + d.label, s.t0, s.t1, "big number");
  notes.forEach(n => K.label(txt(n.x), s.t0, s.t1, "stat note"));
  return t => {
    const e = env(t, s), o = 1 - e.o;
    const c0 = cueT(d, s.t0 + 0.2), cnt = K.eout(K.prog(t, c0, c0 + Math.min(2.0, (s.t1 - c0) * 0.5)));
    big.t.textContent = (d.prefix || "") + fmtNum(d.value * cnt, d.decimals || 0) + (d.suffix || "");
    const by = V(H * 0.47 - Math.min(200, notes.reduce((a, n) => a + n.ms.length, 0) * pitch(NS) / 2), SAFE.y0 + SH * 0.4);
    placeMask(big, W / 2, by, e.i * o * (d.t != null ? K.eout(K.prog(t, c0 - 0.15, c0 + 0.15)) : 1));   // a cued number waits for its word instead of sitting at 0
    lab.forEach((m, k) => { const tk = s.t0 + 0.6 + k * 0.12; placeMask(m, W / 2, by + 110 + k * pitch(LS, 1.3), K.eout(K.prog(t, tk, tk + 0.35)) * o); });
    let ny = by + 110 + lab.length * pitch(LS, 1.3) + 20;
    notes.forEach((n, k) => { const tk = cueT(n.x, revealAt(s, k + 1, notes.length + 1, 0.8, 0.4));
      n.ms.forEach(m => { placeMask(m, W / 2, ny, K.eout(K.prog(t, tk, tk + 0.35)) * o); ny += pitch(NS); }); });
  };
};

B.sms = (s, g) => {
  const d = s.data;
  const pw = 520, ph = 900, px = W / 2 - pw / 2 + (d.offset || 0), py = V(90, SMID - ph / 2);
  const phone = K.el("rect", { fill: "#151515", stroke: "#3a3a38", "stroke-width": 3 }, g);
  const screen = K.el("rect", { fill: "#000" }, g);
  const notch = K.el("rect", { fill: "#151515" }, g);
  // the phone is drawn at a phone's proportions, so its message is small; once the message lands the camera pushes in until
  // the message reads at READ, keeping the sender line in frame, then holds still (a held zoom does not shimmer)
  const MS = 30, ML = 40;
  const who = K.text(d.sender || "+1 (555) 010-0199", { ...AUX, "font-family": SANS, "font-size": 24, fill: C.INK, "text-anchor": "middle" }, g);
  const whoSub = K.text(d.senderNote || "Text Message", { ...AUX, "font-family": SANS, "font-size": 18, fill: C.GREY, "text-anchor": "middle" }, g);
  const lines = wrapWords(d.text, fit(pw - 110 - 48, MS));
  const bub = K.el("rect", { fill: "#262628" }, g);
  const tl = lines.map(l => K.text(l, { "font-family": SANS, "font-size": MS, fill: C.INK }, g));
  const linkLine = K.el("rect", { fill: C.ACCENT }, g);
  const reply = d.reply ? K.el("rect", { fill: "#0a84ff" }, g) : null;
  const replyT = d.reply ? K.text(d.reply, { "font-family": SANS, "font-size": MS, fill: "#fff", "text-anchor": "middle" }, g) : null;
  K.label(d.text, s.t0, s.t1, "text message on a phone");
  return t => {
    const e = env(t, s), o = 1 - e.o;
    const yo = (1 - e.i) * (H - 60) + e.o * -(H - 60);
    K.set(phone, K.rect(px, py + yo, pw, ph, 64)); K.set(screen, K.rect(px + 18, py + 18 + yo, pw - 36, ph - 36, 50));
    K.set(notch, K.rect(W / 2 - 70 + (d.offset || 0), py + 30 + yo, 140, 34, 17));
    K.set(who, { x: px + pw / 2, y: py + 120 + yo }); K.set(whoSub, { x: px + pw / 2, y: py + 148 + yo });
    
    const tb = cueT(d, s.t0 + 0.5), typed = K.prog(t, tb, tb + Math.min(1.6, (s.t1 - s.t0) * 0.35));
    const nShow = Math.ceil(lines.length * typed);
    const bh = 26 + lines.length * ML, bw = pw - 110, bx = px + 40, by = py + 200 + yo;
    const pop = K.step(t, tb - 0.15, 16, 0.7);
    K.set(bub, K.rect(bx, by, bw * Math.min(1, pop), bh * Math.min(1, pop), 26)); 
    tl.forEach((x, k) => { K.set(x, { x: bx + 24, y: by + 46 + k * ML }); x.style.opacity = k < nShow ? 1 : 0; });
    if (d.highlight != null) {
      const k = d.highlight, x = tl[k], len = x.getComputedTextLength();
      const hp = K.eio(K.prog(t, tb + 1.9, tb + 2.5));
      K.set(linkLine, K.rect(bx + 24, by + 54 + k * ML, len * hp, 4));
      x.setAttribute("fill", hp > 0.5 ? C.ACCENT : C.INK);
    } else K.set(linkLine, K.rect(0, 0, 0, 0));
    if (reply) {
      const rt = s.t0 + (d.replyAt || 0.6) * (s.t1 - s.t0), rp = K.step(t, rt, 16, 0.7);
      const rw = 90, rx = px + pw - 40 - rw, ry = by + bh + 40;
      K.set(reply, K.rect(rx + rw * (1 - Math.min(1, rp)), ry, rw * Math.min(1, rp), 56, 26)); 
      K.set(replyT, { x: rx + rw / 2, y: ry + 39 }); replyT.style.opacity = t > rt + 0.1 ? 1 : 0;
    }
    const top = py + 84, bot = py + 200 + bh + (reply ? 40 + 56 : 0) + 30;
    const zr = Math.max(1, Math.min(READ / MS, (H - 120) / (bot - top), (W - 80) / pw)), zp = K.eio(K.prog(t, tb - 0.1, tb + 0.6));
    g.__cam = zp > 0 ? { z: K.lerp(1, zr, zp), cx: W / 2 + (d.offset || 0) * zp, cy: K.lerp(H / 2, (top + bot) / 2, zp) } : null;
  };
};

B.flow = (s, g) => {   // a chain of labelled nodes along one line; the line draws through them
  const d = s.data, n = d.nodes.length;
  const line = K.el("rect", { fill: C.GREY }, g);
  const items = d.nodes.map((nd, k) => {
    const c = K.el("circle", { fill: C.BG, stroke: k === (d.accent ?? -1) ? C.ACCENT : C.INK, "stroke-width": 4 }, g);
    const lab = wrapWords(txt(nd), V(fit(1480 / Math.max(1, n - 1) - 20, READ), fit(W - 380, READ))).map(l => maskText(l, { "font-family": SANS, "font-size": READ, fill: k === (d.accent ?? -1) ? C.ACCENT : C.INK }, g));
    K.label(txt(nd), s.t0, s.t1, "flow diagram");
    return { c, lab };
  });
  const title = d.title ? wrapWords(d.title, V(99, 20)).map(l => maskText(l, { "font-size": Math.max(58, READ), fill: C.INK }, g)) : [];
  if (d.title) K.label(d.title, s.t0, s.t1, "diagram title");
  return t => {
    // wide: nodes left to right with labels under them; tall: top to bottom with labels to the right
    // wide: the end nodes come in far enough that their labels stay in frame
    const half = it => Math.max(0, ...it.lab.map(m => m.t.getComputedTextLength() / 2));
    const e = env(t, s), o = 1 - e.o, a0 = V(Math.max(220, half(items[0]) + 60), SAFE.y0 + 104 + title.length * 70), a1 = V(W - Math.max(220, half(items[n - 1]) + 60), SAFE.y1 - 60), across = V(H * 0.5 - Math.max(...items.map(it => it.lab.length)) * pitch(READ) / 3, 260);
    title.forEach((m, k) => placeMask(m, W / 2, V(200, SAFE.y0 + 64) + k * 66, e.i * o));   // upright: the first line's caps start at the safe area's top
    const lastT = cueT(d.nodes[n - 1], revealAt(s, n - 1, n, d.span || 0.75, 0.4));
    const lp = K.prog(t, s.t0 + 0.3, lastT + 0.2);
    K.set(line, VERT ? K.rect(across - 2, a0, 4, (a1 - a0) * lp * o) : K.rect(a0, across - 2, (a1 - a0) * lp * o, 4));
    items.forEach((it, k) => {
      const along = n === 1 ? (a0 + a1) / 2 : K.lerp(a0, a1, k / (n - 1)), tk = cueT(d.nodes[k], revealAt(s, k, n, d.span || 0.75, 0.4));
      const x = VERT ? across : along, y = VERT ? along : across;
      const r = 26 * Math.min(1.2, K.step(t, tk, 15, 0.55)) * o;
      K.set(it.c, { cx: x, cy: y, r: Math.max(0, r) });
      it.lab.forEach((m, j) => VERT ? placeMask(m, x + 60, y + READ * 0.36 + (j - (it.lab.length - 1) / 2) * pitch(READ), K.eout(K.prog(t, tk + 0.05, tk + 0.4)) * o, "start")
                                    : placeMask(m, x, y + 50 + READ + j * pitch(READ), K.eout(K.prog(t, tk + 0.05, tk + 0.4)) * o));
    });
  };
};

B.hub = (s, g) => {    // one centre, spokes revealed around it
  const d = s.data, n = d.spokes.length;
  const centre = K.el("circle", { fill: C.ACCENT }, g);
  const ct = maskText(d.center, { "font-family": SANS, "font-size": READ, fill: C.BG, "font-weight": 700 }, g);
  let CR = 0;                                                       // the centre circle holds its word
  const spokes = d.spokes.map(sp => ({ l: K.el("line", { stroke: C.GREY, "stroke-width": 3 }, g), c: K.el("circle", { fill: C.BG, stroke: C.INK, "stroke-width": 3 }, g),
    lab: wrapWords(txt(sp), V(14, 12)).map(l => maskText(l, { "font-family": SANS, "font-size": READ, fill: C.INK }, g)) }));
  [d.center, ...d.spokes].forEach(x => K.label(txt(x), s.t0, s.t1, "hub diagram"));
  return t => {
    if (!CR) CR = Math.max(95, ct.t.getComputedTextLength() / 2 + 30);
    const e = env(t, s), o = 1 - e.o, cx = W / 2, cy = SMID, R = V(Math.max(420, CR + 260), Math.max(300, CR + 160)), ry = V(0.62, 1.3);   // tall: an upright oval
    const cr = CR * Math.min(1.15, K.step(t, s.t0 + 0.1, 12, 0.6)) * o;
    K.set(centre, { cx, cy, r: Math.max(0, cr) });
    placeMask(ct, cx, cy + READ * 0.36, K.eout(K.prog(t, s.t0 + 0.3, s.t0 + 0.6)) * o);
    spokes.forEach((sp, k) => {
      const a = -Math.PI / 2 + k * 2 * Math.PI / n, tk = cueT(d.spokes[k], revealAt(s, k, n, 0.7, 0.6));
      const p = K.eio(K.prog(t, tk, tk + 0.4)) * o;
      const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R * ry;
      const rx0 = cx + Math.cos(a) * CR, ry0 = cy + Math.sin(a) * CR * ry;   // spokes grow out from the rim, never across the centre
      K.set(sp.l, { x1: rx0, y1: ry0, x2: K.lerp(rx0, x, p), y2: K.lerp(ry0, y, p) }); K.show(sp.l, p > 0.001);
      K.set(sp.c, { cx: x, cy: y, r: 16 * Math.min(1.2, K.step(t, tk + 0.35, 15, 0.6)) * o });
      const below = Math.sin(a) > 0.2, ly = below ? y + 30 + READ : y - 30 - (sp.lab.length - 1) * pitch(READ);
      sp.lab.forEach((m, j) => placeMask(m, x, ly + j * pitch(READ), K.eout(K.prog(t, tk + 0.4, tk + 0.7)) * o));
    });
  };
};

B.list = (s, g) => {
  const d = s.data, n = d.items.length;
  const title = d.title ? wrapWords(d.title, V(99, 22)).map(l => maskText(l, { "font-size": 58, fill: C.INK }, g)) : [];
  // long items wrap onto more lines, and each row is as tall as its lines
  const IS = Math.round(V(66, 46) * TS), IL = pitch(IS, 1.2), x0 = d.x || V(260, 120);
  const rows = d.items.map((it, k) => ({ box: K.el("rect", { fill: "none", stroke: C.ACCENT, "stroke-width": 3 }, g),
    tick: K.el("path", { fill: "none", stroke: C.ACCENT, "stroke-width": 5, "stroke-linecap": "round", "stroke-linejoin": "round" }, g),
    ms: wrapWords(txt(it), fit(W - x0 - 40 - V(120, 40), IS, 0.5)).map(l => maskText(l, { "font-size": IS, fill: C.INK }, g)) }));
  if (d.title) K.label(d.title, s.t0, s.t1, "list title");
  d.items.forEach(x => K.label(txt(x), s.t0, s.t1, "list"));
  const lines = rows.reduce((a, r) => a + r.ms.length, 0);
  return t => {
    const e = env(t, s), o = 1 - e.o, y0 = V(d.title ? 330 : 260, SAFE.y0 + 60 + title.length * 72);
    const gap = Math.min(V(130, 150), (V(H - 110, SAFE.y1 - 60) - y0 - (lines - n) * IL) / Math.max(1, n - 1));
    title.forEach((m, k) => placeMask(m, x0 - 20, V(200, SAFE.y0 + 20) + k * 66, e.i * o, "start"));
    let y = y0;
    rows.forEach((r, k) => {
      if (k) y += gap + (rows[k - 1].ms.length - 1) * IL;
      const tk = cueT(d.items[k], revealAt(s, k, n, d.span || 0.8, 0.5)), p = K.step(t, tk, 15, 0.6) * o;
      K.set(r.box, K.rect(x0 - 20 - 40 * Math.min(1, p) / 2 + 20 - 20, y - 34, 40 * Math.min(1, p), 40 * Math.min(1, p), 6));
      const tp = K.eio(K.prog(t, tk + 0.2, tk + 0.45)) * o;
      r.tick.setAttribute("d", `M ${x0 - 32} ${y - 14} L ${x0 - 22} ${y - 4} L ${x0 - 22 + 22 * tp} ${y - 4 - 24 * tp}`);
      r.tick.style.opacity = tp > 0.01 ? 1 : 0;
      r.ms.forEach((m, j) => placeMask(m, x0 + 40, y + j * IL, K.eout(K.prog(t, tk + 0.05 + j * 0.06, tk + 0.4 + j * 0.06)) * o, "start"));
    });
  };
};

B.quote = (s, g) => {
  const d = s.data, lines = wrapWords("“" + d.text + "”", V(40, 22));
  const ms = lines.map(l => maskText(l, { "font-size": V(58, 60), fill: C.INK, "font-style": "italic" }, g));
  const who = maskText("— " + d.who, { ...AUX, "font-family": SANS, "font-size": V(40, 34), fill: C.ACCENT, "letter-spacing": 2 }, g);
  const bar = K.el("rect", { fill: C.ACCENT }, g);
  K.label(d.text + " — " + d.who, s.t0, s.t1, "quote card");
  return t => {
    const e = env(t, s), o = 1 - e.o, lh = 80, y0 = V(H * 0.44, SMID - 40) - (lines.length - 1) * lh / 2, bx = V(250, 70), tx = V(300, 110);
    K.set(bar, K.rect(bx, y0 - 60, 8, (lines.length * lh + 20) * K.eio(K.prog(t, s.t0, s.t0 + 0.6)) * o));
    ms.forEach((m, k) => placeMask(m, tx, y0 + k * lh, K.eout(K.prog(t, s.t0 + 0.15 + k * 0.12, s.t0 + 0.5 + k * 0.12)) * o, "start"));
    placeMask(who, tx, y0 + lines.length * lh + 30, K.eout(K.prog(t, s.t0 + 0.8, s.t0 + 1.1)) * o, "start");
  };
};

B.bars = (s, g) => {   // horizontal bar chart, values revealed one by one
  const d = s.data, n = d.rows.length, max = Math.max(...d.rows.map(r => r[1]));
  const title = wrapWords(d.title, V(99, 22)).map(l => maskText(l, { "font-size": Math.max(58, READ), fill: C.INK }, g));
  const rows = d.rows.map(([lab, v], k) => ({ r: K.el("rect", { fill: k === (d.accent ?? -1) ? C.ACCENT : C.GREY }, g),
    l: maskText(lab, { "font-family": SANS, "font-size": READ, fill: C.INK }, g), v: maskText("", { "font-family": SANS, "font-size": READ, fill: C.INK }, g), val: v }));
  K.label(d.title, s.t0, s.t1, "chart title");
  d.rows.forEach(([lab, v]) => K.label(`${lab}: ${(d.prefix || "")}${fmtNum(v, d.decimals || 0)}${d.suffix || ""}`, s.t0, s.t1, "bar chart"));
  return t => {
    // wide: labels left of the bars; tall: each label above its bar, and the bars run nearly the full width
    const e = env(t, s), o = 1 - e.o, x0 = V(Math.min(820, 160 + Math.max(...rows.map(r => r.l.t.getComputedTextLength()))), 90), wmax = V(W - x0 - 340, 640);
    const y0 = V(330, SAFE.y0 + 120 + title.length * 66);
    const gap = V(Math.min(120, 600 / Math.max(1, n - 1)), Math.min(170, (SAFE.y1 - 40 - y0) / Math.max(1, n - 1)));
    title.forEach((m, k) => placeMask(m, W / 2, V(200, SAFE.y0 + 30) + k * 64, e.i * o));
    rows.forEach((r, k) => {
      const tk = cueT(d.rows[k][2], revealAt(s, k, n, 0.6, 0.5)), p = K.eout(K.prog(t, tk, tk + 0.8)) * o, y = y0 + k * gap;
      K.set(r.r, K.rect(x0, y - READ * 0.62, wmax * r.val / max * p, READ * 0.8, 4));
      if (VERT) placeMask(r.l, x0, y - READ * 0.62 - 14, K.eout(K.prog(t, tk - 0.1, tk + 0.25)) * o, "start");
      else placeMask(r.l, x0 - 30, y, K.eout(K.prog(t, tk - 0.1, tk + 0.25)) * o, "end");
      r.v.t.textContent = (d.prefix || "") + fmtNum(r.val * p / Math.max(o, 1e-6), d.decimals || 0) + (d.suffix || "");
      placeMask(r.v, x0 + wmax * r.val / max * p + 20, y, K.eout(K.prog(t, tk + 0.2, tk + 0.5)) * o, "start");
    });
  };
};

B.title = (s, g) => {   // the cold-open title card
  const d = s.data, lines = wrapWords(d.title, V(22, 12));
  const ms = lines.map((l, k) => maskText(l, { "font-size": V(110, 104), fill: k === lines.length - 1 ? C.ACCENT : C.INK }, g));
  const sub = d.sub ? maskText(d.sub, { ...AUX, "font-family": SANS, "font-size": 32, fill: C.GREY, "letter-spacing": 3 }, g) : null;
  ms.forEach(m => K.label(m.t.textContent, s.t0, s.t1, "title card"));
  return t => {
    const e = env(t, s), o = 1 - e.o, lh = V(130, 124), y0 = V(H * 0.45, SMID - 40) - (lines.length - 1) * lh / 2;
    ms.forEach((m, k) => placeMask(m, W / 2, y0 + k * lh, K.eout(K.prog(t, s.t0 + 0.1 + k * 0.15, s.t0 + 0.55 + k * 0.15)) * o));
    if (sub) placeMask(sub, W / 2, y0 + lines.length * lh + 10, K.eout(K.prog(t, s.t0 + 0.7, s.t0 + 1.0)) * o);
  };
};

// ── people: stage scenes with rigged figures (figure.js) ─────────────
// data: { set: "street"|"room"|"desk"|"blank", light?: "left"|"right", foreground?: true, look?: "soft"|"flat", shadow?: "#hex", ink?: "#hex", screen?: {url, title?, lines?} (what the desk's monitor shows), kicker?, cast: [{id, x: 0..1, h?, skin, hair, hairColor, shirt, pants,
//         kind: "person"|"silhouette", face, pose, enter: "left"|"right"}],
//         beats: [{at, who, pose?, face?, emote?: "?"|"!"|"$"|"…", say?, think?, notify?, from?, sms?, sender?, senderNote?, move?: x, glow?: true}] }
// Every beat with "at" fires on its spoken word; a beat without one fires at `time` (0..1 of the segment).
// Each set names its place at a glance with a few props, drawn flat in the scene's palette. Returns the ground line and
// the boxes a notification should keep clear of (the monitor's screen).
function drawSet(kind, g, d = {}) {
  const gy = V(900, SAFE.y1 - 40), sx = W / 1920, X = v => v * sx;   // tall: the ground sits low in the safe area, furniture squeezes in
  const occ = [], wood = "#2b2724", dark = "#1b1918", line = "#33363a";
  if (kind !== "blank") K.el("rect", { x: -W / 2, y: -300, width: 2 * W, height: gy + 300, fill: kind === "street" ? "#0d0e10" : "#100f0e" }, g);
  const floorC = "#131312", floor = K.el("rect", { fill: floorC }, g);
  K.set(floor, K.rect(-W / 2, gy, 2 * W, H - gy + 200));   // wall and floor reach half a frame past each edge: the camera leans up to 0.35 of that
  K.el("rect", { x: -W / 2, y: gy - 2, width: 2 * W, height: 3, fill: "#2a2a28" }, g);
  // data.light ("left" | "right"): shadows on the floor, cast away from that side, under every prop (`feet`, drawn
  // below) and every figure (the stage frame). Off unless asked for, so older films render the same.
  // data.look "flat" draws them for a flat, outlined art style: hard-edged, one darker tone of the floor (data.shadow
  // overrides it) at 25% opacity, no blur, offset away from the light by 6% of the object's height; the default "soft" blurs
  const flat = d.look === "flat", tone = d.shadow || K.mix(floorC, "#000000", 0.5);
  const shade = d.light ? K.el("g", flat ? { opacity: 0.25 } : { filter: `url(#${stageBlur()})` }, g) : null, feet = [];
  const r = K.rng(kind.length * 7 + 3);
  const plant = (x, s = 1) => {                          // a potted plant: pot and five leaves
    feet.push([x - 30 * s, x + 30 * s, 195 * s]);
    K.el("path", { d: `M ${x - 34 * s} ${gy - 70 * s} L ${x + 34 * s} ${gy - 70 * s} L ${x + 26 * s} ${gy} L ${x - 26 * s} ${gy} Z`, fill: "#5a3a2a" }, g);
    [[-40, -150, -0.5], [-14, -190, -0.15], [14, -195, 0.15], [40, -155, 0.5], [0, -140, 0]].forEach(([dx, dy, k]) =>
      K.el("path", { d: `M ${x} ${gy - 70 * s} Q ${x + dx * s * 1.6} ${gy + (dy + 40) * s} ${x + dx * s} ${gy + dy * s} Q ${x + dx * s * 0.3} ${gy + (dy + 70) * s} ${x} ${gy - 70 * s} Z`,
                     fill: k ? "#2f5a3a" : "#3a6b45" }, g));
  };
  const lamp = (x, y, h) => {                            // a lamp with a lit shade and a soft pool of light
    feet.push([x - 40, x + 40, h]);
    K.el("ellipse", { cx: x, cy: y - h + 40, rx: 150, ry: 110, fill: "#3a3222", opacity: 0.25 }, g);
    K.el("rect", { x: x - 4, y: y - h + 40, width: 8, height: h - 40, fill: dark }, g);
    K.el("rect", { x: x - 40, y: y - 8, width: 80, height: 8, rx: 4, fill: dark }, g);
    K.el("path", { d: `M ${x - 34} ${y - h + 50} L ${x - 54} ${y - h + 110} L ${x + 54} ${y - h + 110} L ${x + 34} ${y - h + 50} Z`, fill: "#c9a45c" }, g);
  };
  if (kind === "street") {
    for (let i = 0; i < 9; i++) {
      const bw = X(140 + r() * 160), bh = 220 + r() * 300, bx = X(-60 + i * 240 + r() * 40);
      K.el("rect", { x: bx, y: gy - bh, width: bw, height: bh, fill: i % 2 ? "#161615" : "#191918" }, g);
      for (let wy = gy - bh + 30; wy < gy - 60; wy += 56) for (let wx = bx + 22; wx < bx + bw - 30; wx += 46)
        if (r() > 0.55) K.el("rect", { x: wx, y: wy, width: 20, height: 28, fill: r() > 0.7 ? "#3a3222" : "#232321" }, g);
    }
    feet.push([X(1500) - 30, X(1500) + 40, 440]);
    K.el("rect", { x: X(1500), y: gy - 430, width: 10, height: 430, fill: "#2a2a28" }, g);
    K.el("rect", { x: X(1500) - 40, y: gy - 440, width: 70, height: 14, rx: 7, fill: "#2a2a28" }, g);
    K.el("ellipse", { cx: X(1505), cy: gy - 420, rx: 120, ry: 60, fill: "#3a3222", opacity: 0.3 }, g);   // the street lamp's glow
  } else if (kind === "room") {
    K.el("rect", { x: X(220), y: gy - 670, width: X(360), height: 300, rx: 6, fill: "#151a20", stroke: "#2a2a28", "stroke-width": 8 }, g);
    K.el("rect", { x: X(400) - 4, y: gy - 670, width: 8, height: 300, fill: "#2a2a28" }, g);
    K.el("circle", { cx: X(520), cy: gy - 610, r: 22, fill: "#d9d2bd", opacity: 0.8 }, g);                 // the moon in the window
    K.el("rect", { x: X(820), y: gy - 640, width: X(200), height: 150, fill: "#1d1b18", stroke: "#4a3d2c", "stroke-width": 10 }, g);   // a framed picture
    K.el("path", { d: `M ${X(840)} ${gy - 505} L ${X(890)} ${gy - 580} L ${X(930)} ${gy - 540} L ${X(960)} ${gy - 575} L ${X(1000)} ${gy - 505} Z`, fill: "#3a4a3e" }, g);
    K.el("rect", { x: X(1240), y: gy - 170, width: X(520), height: 120, rx: 26, fill: "#24211f" }, g);
    K.el("rect", { x: X(1220), y: gy - 230, width: X(560), height: 90, rx: 30, fill: wood }, g);
    feet.push([X(1230), X(1770), 230]);
    K.el("rect", { x: X(1250), y: gy - 50, width: 18, height: 50, fill: dark }, g); K.el("rect", { x: X(1750) - 18, y: gy - 50, width: 18, height: 50, fill: dark }, g);
    K.el("rect", { x: X(1300), y: gy - 210, width: 90, height: 70, rx: 14, fill: "#7a3b2b" }, g);          // a cushion
    lamp(X(1840), gy, 420);
    plant(X(1100), 0.9);
  } else if (kind === "desk") {
    const dx0 = X(980), dx1 = X(1780), top = gy - 300, cx = (dx0 + dx1) / 2;
    feet.push([dx0, dx1, 300]);
    K.el("rect", { x: dx0, y: top, width: dx1 - dx0, height: 22, rx: 4, fill: wood }, g);
    K.el("rect", { x: dx0 + 30, y: top + 22, width: 16, height: 278, fill: "#221f1d" }, g);
    K.el("rect", { x: dx1 - 190, y: top + 22, width: 160, height: 200, rx: 4, fill: "#221f1d" }, g);      // a drawer unit
    [70, 140].forEach(y => K.el("rect", { x: dx1 - 135, y: top + 22 + y - 30, width: 50, height: 8, rx: 4, fill: line }, g));
    // the monitor at a monitor's size beside a person: bezel, lit screen, neck and foot. data.screen puts a browser page on
    // it, as set dressing: its text is too small to read, so say what matters in a notification or bubble too
    const sw = 380, sh = 230, sxl = cx - sw / 2, syt = top - 70 - sh;
    K.el("rect", { x: cx - 14, y: top - 72, width: 28, height: 60, fill: line }, g);
    K.el("rect", { x: cx - 80, y: top - 14, width: 160, height: 14, rx: 6, fill: line }, g);
    K.el("rect", { x: sxl - 14, y: syt - 14, width: sw + 28, height: sh + 28, rx: 14, fill: "#0e0f11", stroke: line, "stroke-width": 3 }, g);
    K.el("rect", { x: sxl, y: syt, width: sw, height: sh, rx: 4, fill: d.screen ? "#e9e6df" : "#1f2a36" }, g);
    if (d.screen) {
      const sc = d.screen, us = Math.min(24, Math.floor((sw - 70) / (0.55 * Math.max(8, (sc.url || "").length))));
      K.el("rect", { x: sxl, y: syt, width: sw, height: 40, rx: 4, fill: "#cfcbc2" }, g);
      [0, 1, 2].forEach(k => K.el("circle", { cx: sxl + 14 + k * 16, cy: syt + 20, r: 4, fill: "#9a958b" }, g));
      K.el("rect", { x: sxl + 62, y: syt + 8, width: sw - 74, height: 24, rx: 12, fill: "#f4f2ed" }, g);
      K.text(sc.url || "", { ...AUX, "font-family": SANS, "font-size": us, fill: "#1d1a17", x: sxl + 74, y: syt + 20 + us * 0.36 }, g);
      if (sc.title) K.text(sc.title, { ...AUX, "font-family": SANS, "font-weight": 700, "font-size": 30, fill: "#1d1a17", x: sxl + 20, y: syt + 84 }, g);
      for (let k = 0; k < (sc.lines ?? 4); k++)
        K.el("rect", { x: sxl + 20, y: syt + (sc.title ? 104 : 60) + k * 26, width: (sw - 40) * (k % 3 === 2 ? 0.6 : 0.9), height: 10, rx: 5, fill: "#bdb8ad" }, g);
      if (sc.url) K.label(sc.url + (sc.title ? " — " + sc.title : ""), 0, 1e9, "screen on the desk");
      occ.push({ x0: sxl - 14, x1: sxl + sw + 14, y0: syt - 14, y1: syt + sh + 14 });
    } else {
      K.el("path", { d: `M ${sxl + 30} ${syt + sh - 30} L ${sxl + sw * 0.4} ${syt + 40} L ${sxl + sw * 0.55} ${syt + 40} L ${sxl + 60} ${syt + sh - 30} Z`, fill: "#2a3846", opacity: 0.8 }, g);   // a sheen
    }
    K.el("rect", { x: cx - 150, y: top - 16, width: 230, height: 14, rx: 4, fill: "#3a3d42" }, g);         // keyboard

      // two-shot with a long message has no clear spot, and covering the kicker or the space above the safe area is worse
      const hr = 0.13 * h, torso = { x0: x - 0.2 * h, x1: x + 0.2 * h, y0: hy0 + hr, y1: gy - 0.5 * h };
      heads.push({ x0: hx1 - hr, x1: hx1 + hr, y0: hy0 - hr, y1: hy0 + hr, who: id, part: "head", lim: 0.15 }, { ...torso, who: id, part: "body", lim: 0.25 });
      occ.push({ x0: hx1 - hr, x1: hx1 + hr, y0: hy0 - hr, y1: hy0 + hr, w: 4 },
               { ...torso, id, own: 1 }, { x0: x - 0.2 * h, x1: x + 0.2 * h, y0: gy - 0.5 * h, y1: gy, id });
      const ep = emote && t - emoT < 1.4 ? K.step(t, emoT, 16, 0.5) * (1 - K.ein(K.prog(t, emoT + 1.1, emoT + 1.4))) : 0;
      emotes[id].textContent = ep > 0.02 ? (EMOTE[emote] || emote) : "";
      K.set(emotes[id], { x: hx + (face === "left" ? 70 : -70), y: hy - 20 - 30 * ep, "font-size": 70 * Math.max(0, ep) });
      pend.push({ id, x, h, face, hy0, note, noteFrom, noteT, msgT, np: note ? Math.min(1.06, K.step(t, noteT, 15, 0.65)) : 0,
                  msg, msgWho, msgSub, mp: msg ? Math.min(1.06, K.step(t, msgT, 15, 0.65)) : 0 });
    });
    // notifications go last, on whichever side of the holder (or above the head) covers the least of the others and the bubbles
    g.__covers = [];   // [card text, whose head or body it covers]: read by check
    const area = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) * Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
    const NL = pitch(READ, 1.15);
    // the spot for a card that appears at time `at` and stays: beside the phone hand at head height is best; then lower or
    // higher on that side, then the other side, then overhead. `shape(chars)` gives the card's {nw, nh} with its words wrapped
    // at that many characters a line; the usual wrap is tried with a narrower one (fits beside a figure near the frame edge)
    // and a wider one (fits overhead), at a small cost, as a letterer reflows a balloon to its space. Returns the box, the
    // shape and the anchor it scales out of (the phone, or the head when overhead). A bubble gone before `at` is ignored;
    // one up at any time after it counts from the start
    const place = (id, x, h, face, hy0, chars, shape, at, what) => {
      const side = face === "left" ? -1 : 1, spots = [];
      [[chars, 0], [Math.round(chars * 0.7), 1500], [Math.round(chars * 1.5), 1500]].forEach(([c, pen]) => {
        const sh = pen ? shape(c, 6) : shape(c), { nw, nh } = sh;
        if (pen && (nw > W - 40 || sh.cut)) return;   // a reflow may run to 6 lines, but never drops words
        const inF = (cx, cy) => [Math.min(Math.max(cx, sx + 20), sx + W - nw - 20), Math.min(Math.max(V(16, SAFE.y0), cy), gy - nh - 20)];
        const near = side > 0 ? x + 0.2 * h + 40 : x - 0.2 * h - 40 - nw, far = side > 0 ? x - 0.2 * h - 40 - nw : x + 0.2 * h + 40;
        const pref = hy0 - nh / 2 - 20, cand = [];
        for (let dy = -240; dy <= 360; dy += 40) { cand.push([side, inF(near, pref + dy), dy]); cand.push([-side, inF(far, pref + dy), dy]); }
        cand.push([0, inF(x - nw / 2, hy0 - 0.2 * h - nh - 30), 0]);
        cand.forEach(([sd, [cx, cy], dy]) => {
          const r = { x0: cx, x1: cx + nw, y0: cy, y1: cy + nh };
          spots.push({ sd, cx, cy, sh, cost: occ.reduce((a, o) => a + (o.t1 <= at + 1e-6 ? 0 : area(r, o) * (o.id === id ? o.own || 0.3 : o.w || 1)), 0) + (sd === side ? 0 : 3000) + 6 * Math.abs(dy) + pen });
        });
      });
      const sp = spots.sort((a, b) => a.cost - b.cost)[0], { nw, nh } = sp.sh, r = { x0: sp.cx, x1: sp.cx + nw, y0: sp.cy, y1: sp.cy + nh };
      occ.push(r);   // a later note or message keeps clear of this one
      heads.forEach(hd => { if (area(r, hd) > hd.lim * (hd.x1 - hd.x0) * (hd.y1 - hd.y0)) g.__covers.push([what, `${hd.who}'s ${hd.part}`]); });
      return { nx: sp.cx, ny: sp.cy, sd: sp.sd, sh: sp.sh, ax: sp.sd ? x + sp.sd * (0.2 * h + 40) : x, ay: sp.sd ? gy - 0.6 * h : hy0 - 0.2 * h };
    };
    const grow = (el, p, ax, ay) => el.setAttribute("transform", `translate(${ax} ${ay}) scale(${p}) translate(${-ax} ${-ay})`);
    pend.forEach(({ id, x, h, face, hy0, note, noteFrom, noteT, msgT, np, msg, msgWho, msgSub, mp }) => {
      const N = notes[id], M = msgs[id];
      // whichever came first is placed first, so the later one steers round it
      const drawNote = () => { if (np > 0.01) {
        const shape = (c, n = 4) => { const all = wrapWords(note, c), ls = all.slice(0, n);
          return { ls, cut: all.length > n, nw: Math.max(390, Math.max(...ls.map(l => l.length)) * READ * 0.55 + 48), nh: 64 + ls.length * NL }; };
        const { nx, ny, ax, ay, sh: { ls, nw, nh } } = place(id, x, h, face, hy0, fit(V(620, 520), READ), shape, noteT, note);
        K.show(N.g, true); grow(N.g, np, ax, ay);
        K.set(N.box, K.rect(nx, ny, nw, nh, 18)); N.from.textContent = noteFrom; K.set(N.from, { x: nx + 24, y: ny + 36 });
        N.lines.forEach((l, k) => { l.textContent = ls[k] || ""; K.set(l, { x: nx + 24, y: ny + 50 + READ * 0.85 + k * NL }); });
      } else K.show(N.g, false); };
      const drawMsg = () => { if (mp > 0.01) {
        // sender and "Text Message" centred above a received (left-aligned) bubble, as on the sms scene's screen
        const P = 22, head = V(80, 74);
        const shape = (c, n = 4) => { const all = wrapWords(msg, c), ls = all.slice(0, n), bw = Math.max(300, Math.max(...ls.map(l => l.length)) * READ * 0.55 + 48), bh = 28 + ls.length * NL;
          return { ls, cut: all.length > n, bw, bh, nw: bw + 2 * P + 30, nh: P + head + bh + P }; };
        const { nx, ny, ax, ay, sh: { ls, bw, bh, nw, nh } } = place(id, x, h, face, hy0, fit(V(620, 520), READ), shape, msgT, msg), bx = nx + P, by = ny + P + head;
        K.show(M.g, true); grow(M.g, mp, ax, ay);
        K.set(M.scr, K.rect(nx, ny, nw, nh, 30));
        M.who.textContent = msgWho; M.sub.textContent = msgSub;
        K.set(M.who, { x: nx + nw / 2, y: ny + P + V(30, 28), "text-anchor": "middle" }); K.set(M.sub, { x: nx + nw / 2, y: ny + P + V(60, 56), "text-anchor": "middle" });
        K.set(M.bub, K.rect(bx, by, bw, bh, 26));
        const cx = bx, dir = -1;   // a received message: tail at the bubble's bottom left, as on the sms scene's screen
        M.tail.setAttribute("d", `M ${cx - dir * 22} ${by + bh - 30} Q ${cx - dir * 4} ${by + bh - 4} ${cx + dir * 12} ${by + bh} Q ${cx - dir * 14} ${by + bh + 2} ${cx - dir * 34} ${by + bh - 10} Z`);
        M.lines.forEach((l, k) => { l.textContent = ls[k] || ""; K.set(l, { x: bx + 24, y: by + 14 + READ * 0.85 + k * NL }); });
      } else K.show(M.g, false); };
      if (msg && noteT > msgT) { drawMsg(); drawNote(); } else { drawNote(); drawMsg(); }
    });
    void o;
    // the foreground sits on the frame's corners when the camera is at its average place and, being nearer the lens,
    // slides 35% further than the set as the camera pans away from there (the group pans with the set; this adds the rest)
    if (fore) fore.g.setAttribute("transform", `translate(${(camMid - W / 2 - 0.35 * (fx - camMid)).toFixed(2)} 0)`);
    g.__cam = { cx: fx, cy: H / 2, z: 1, frac: 1 };
  };
};

// ── the evidence board: cards pinned up as they are named, red string between them, a stamp on the verdict ──
// data: { title?, cards: [{id, x, y (0..1), title, text?, icon?: "phone"|"bank"|"card"|"person"|"money"|"web"|"doc", at?}],
//         strings: [{from, to, at?}], stamp?: {on, text, at?} }
const ICONS = {
  phone: "M -14 -24 h 28 a 5 5 0 0 1 5 5 v 38 a 5 5 0 0 1 -5 5 h -28 a 5 5 0 0 1 -5 -5 v -38 a 5 5 0 0 1 5 -5 Z M -5 16 h 10",
  bank: "M -26 -6 L 0 -24 L 26 -6 Z M -22 -2 v 20 M -8 -2 v 20 M 8 -2 v 20 M 22 -2 v 20 M -28 22 h 56",
  card: "M -28 -18 h 56 a 5 5 0 0 1 5 5 v 30 a 5 5 0 0 1 -5 5 h -56 a 5 5 0 0 1 -5 -5 v -30 a 5 5 0 0 1 5 -5 Z M -33 -6 h 66 M -22 10 h 16",
  person: "M 0 -24 a 10 10 0 1 1 -0.1 0 Z M -20 22 c 0 -16 8 -22 20 -22 c 12 0 20 6 20 22 Z",
  money: "M -28 -16 h 56 v 32 h -56 Z M 0 -8 a 8 8 0 1 1 -0.1 0 Z",
  web: "M 0 -24 a 24 24 0 1 1 -0.1 0 Z M -24 0 h 48 M 0 -24 c -12 12 -12 36 0 48 M 0 -24 c 12 12 12 36 0 48",
  doc: "M -18 -24 h 26 l 10 10 v 38 h -36 Z M -10 -6 h 20 M -10 4 h 20 M -10 14 h 14",
  x: "M -17 -17 L 17 17 M 17 -17 L -17 17",
  check: "M -20 2 L -6 16 L 20 -16",
};
// do/don't colours: the palette's own RED and GREEN when it has them, else these (both read on dark and light grounds)
const TONES = { red: C.RED || "#e0483e", green: C.GREEN || "#3fae5a" };
B.board = (s, g) => {
  const d = s.data, r = K.rng(s.id.length * 13 + 5);
  const panel = K.el("rect", { fill: "#16140f", stroke: "#2c2820", "stroke-width": 6 }, g);
  const BX = V([60, 90, W - 120, H - 200], [40, SAFE.y0 - 40, W - 80, SH + 80]);   // the board itself; cards' x, y (0..1) map onto the safe area
  const specks = [...Array(140)].map(() => K.el("circle", { cx: BX[0] + 30 + r() * (BX[2] - 60), cy: BX[1] + 20 + r() * (BX[3] - 60), r: 0.8 + r() * 1.6, fill: "#221e17" }, g));
  void specks;
  const title = d.title ? maskText(d.title, { ...AUX, "font-family": SANS, "font-size": 30, fill: C.GREY, "letter-spacing": 5 }, s.ov) : null;
  const strG = K.el("g", {}, g), cardG = K.el("g", {}, g);
  const n = d.cards.length;
  const cards = d.cards.map((c, k) => {
    const TS1 = READ, XS = READ, w = c.w || Math.round(V(440, 420) * TS), tl = wrapWords(c.title, fit(w - 40, TS1, 0.58)), xl = wrapWords(c.text || "", fit(w - 40, XS, 0.5)).slice(0, 3);
    const cg = K.el("g", {}, cardG), h = (c.icon ? 74 : 26) + tl.length * pitch(TS1, 1.15) + xl.length * pitch(XS, 1.15) + 30;
    K.el("rect", { x: -w / 2 + 6, y: -h / 2 + 8, width: w, height: h, rx: 4, fill: "#000", opacity: 0.35 }, cg);
    K.el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 4, fill: c.kind === "note" ? "#e9d98a" : "#e6e2d8" }, cg);
    let y = -h / 2 + 26;
    if (c.icon) { K.el("path", { d: ICONS[c.icon] || ICONS.doc, transform: `translate(0 ${y + 24})`, fill: "none", stroke: "#2b2722", "stroke-width": 3.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, cg); y += 74; }
    tl.forEach(l => { K.text(l, { x: 0, y: y + TS1 * 0.85, "text-anchor": "middle", "font-family": SANS, "font-weight": 700, "font-size": TS1, fill: "#1d1a17" }, cg); y += pitch(TS1, 1.15); });
    xl.forEach(l => { K.text(l, { x: 0, y: y + XS * 0.8, "text-anchor": "middle", "font-family": FONT, "font-size": XS, fill: "#4a443c" }, cg); y += pitch(XS, 1.15); });
    const pin = K.el("circle", { cx: 0, cy: -h / 2 + 12, r: 9, fill: C.ACCENT, stroke: "#7a3a14", "stroke-width": 2 }, cg);
    void pin;
    K.label(c.title + (c.text ? ": " + c.text : ""), s.t0, s.t1, "evidence card");
    return { c, g: cg, x: SAFE.x0 + c.x * (SAFE.x1 - SAFE.x0), y: SAFE.y0 + c.y * SH, h, rot: (r() - 0.5) * 6, T: cueT(c, revealAt(s, k, n, 0.6, 0.4)) };
  });
  const byId = Object.fromEntries(cards.map(c => [c.c.id, c]));
  const strings = (d.strings || []).map((st, k) => ({ st, el: K.el("path", { fill: "none", stroke: "#c2412d", "stroke-width": 4, "stroke-linecap": "round" }, strG),
    T: cueT(st, Math.max(byId[st.from].T, byId[st.to].T) + 0.4 + k * 0.15) }));
  const stamp = d.stamp ? (() => { const sg = K.el("g", {}, g);
    const box = K.el("rect", { fill: "none", stroke: "#c2412d", "stroke-width": 8, rx: 10 }, sg);
    const tx = K.text(d.stamp.text, { "font-family": SANS, "font-weight": 800, "font-size": 84, fill: "#c2412d", "text-anchor": "middle", "letter-spacing": 6 }, sg);
    K.label(d.stamp.text, s.t0, s.t1, "stamp");
    return { sg, box, tx, T: cueT(d.stamp, s.t0 + (s.t1 - s.t0) * 0.75) }; })() : null;
  if (d.title) K.label(d.title, s.t0, s.t1, "board title");
  return t => {
    const e = env(t, s), o = 1 - e.o;
    K.set(panel, K.rect(BX[0], BX[1], BX[2], BX[3], 8));
    if (title) placeMask(title, BX[0] + 30, BX[1] - 24, e.i * o, "start");
    // camera leans toward the newest card
    const fx = K.kf(t, camKeys(s.t0, W / 2, cards.map(c => [c.T, K.lerp(W / 2, c.x, 0.4)]))), fy = K.kf(t, camKeys(s.t0, H / 2, cards.map(c => [c.T, K.lerp(H / 2, c.y, 0.4)]))), shown = 0;
    const shake = stamp ? K.bump(t, stamp.T + 0.12, 7) * 10 : 0;
    cards.forEach(c => {
      const p = Math.min(1.1, K.step(t, c.T, 15, 0.55)) * o;
      K.show(c.g, p > 0.01);
      c.g.setAttribute("transform", `translate(${c.x} ${c.y - (1 - Math.min(1, p)) * 40}) rotate(${c.rot}) scale(${Math.max(0, p)})`);
    });
    strings.forEach(st => {
      const a = byId[st.st.from], b = byId[st.st.to], p = K.eio(K.prog(t, st.T, st.T + 0.6)) * o;
      const ax = a.x, ay = a.y - a.h / 2 + 12, bx = K.lerp(ax, b.x, p), by = K.lerp(ay, b.y - b.h / 2 + 12, p);
      const sag = 40 * p;
      st.el.setAttribute("d", p > 0.001 ? `M ${ax} ${ay} Q ${(ax + bx) / 2} ${(ay + by) / 2 + sag} ${bx} ${by}` : "");
    });
    if (stamp) {
      const on = byId[d.stamp.on] || { x: W / 2, y: H / 2 }, p = K.prog(t, stamp.T, stamp.T + 0.18);
      const sc = t < stamp.T ? 0 : K.lerp(1.8, 1, K.ein(p)) * o;
      K.show(stamp.sg, sc > 0.01);
      const w = stamp.tx.getComputedTextLength() + 60;
      K.set(stamp.box, { x: -w / 2, y: -62, width: w, height: 100 }); K.set(stamp.tx, { x: 0, y: 18 });
      // tilted 12 degrees, the stamp reaches E above and below its centre and X to each side. It goes under the card's
      // words, overlapping only the card's bottom margin; where the board ends first, it goes over the card's top edge
      const sn = Math.sin(12 * Math.PI / 180), cs = Math.cos(12 * Math.PI / 180), E = (w / 2) * sn + 50 * cs + 12, X = (w / 2) * cs + 50 * sn;
      const h = on.h || 0, below = on.y + h / 2 - 24 + E;
      const sy = below + E < BX[1] + BX[3] - 16 ? below : on.y - h / 2 + 8 - E;
      const sx = Math.min(Math.max(on.x + 30, BX[0] + X + 16), BX[0] + BX[2] - X - 16);
      stamp.sg.setAttribute("transform", `translate(${sx} ${sy}) rotate(-12) scale(${sc})`);
    }
    void shown;
    g.__cam = { cx: fx, cy: fy + shake, z: 1 };   // no push: card text under a slow zoom shimmers; the lean is a pan
  };
};

// ── a crowd: rows of seated people on phones; the camera starts on one and pulls back to show the room ──
// data: { rows, cols, label?, from?: 0..1 (pull-back start), to?: 0..1, count?: {value, prefix?, suffix?, label?, at?} }
B.crowd = (s, g) => {
  const d = s.data, rows = d.rows || 4, cols = d.cols || 8, room = K.el("g", {}, g);
  const people = F.crowd(room, rows * cols, s.id.length * 5 + 2, { each: { pants: "#22262c" } });
  const desks = [], seeds = K.rng(41);
  const sp = [];
  for (let rr = 0; rr < rows; rr++) for (let cc = 0; cc < cols; cc++) {
    const k = rr * cols + cc, sc = 0.55 + rr * 0.15, x = W / 2 + (cc - (cols - 1) / 2) * 230 * sc, y = V(430, SAFE.y0 + 380) + rr * 150;
    const u = 300 * sc / 92;
    sp.push({ x, y, h: 300 * sc, ph: seeds() * 10, face: cc < cols / 2 ? "right" : "left" });
    desks.push(K.el("rect", { x: x - 70 * sc, y: y - 31 * u, width: 140 * sc, height: 6 * u, rx: 2, fill: "#2b2724" }, room));
  }
  // later rows are nearer: draw them on top
  // nearer rows draw on top; each bench sits behind its sitter
  people.forEach((f, k) => { room.appendChild(desks[k]); room.appendChild(f.root); });
  const label = d.label ? maskText(d.label, { "font-size": 64, fill: C.INK }, g) : null;
  const cnt = d.count ? maskText("", { "font-size": 140, fill: C.ACCENT }, g) : null;
  const cntL = d.count && d.count.label ? maskText(d.count.label, { "font-family": SANS, "font-size": READ, fill: C.INK }, g) : null;
  if (d.label) K.label(d.label, s.t0, s.t1, "crowd label");
  if (d.count) K.label(`${d.count.prefix || ""}${fmtNum(d.count.value, 0)}${d.count.suffix || ""} ${d.count.label || ""}`, s.t0, s.t1, "count");
  const hero = sp[Math.floor(cols / 2) + (rows - 1) * cols];
  const zEnd = V(1, Math.min(1, (W - 60) / (cols * 230 * (0.55 + (rows - 1) * 0.15))));   // tall: pull back far enough to show every seat
  return t => {
    const e = env(t, s), o = 1 - e.o;
    people.forEach((f, k) => {
      const q = sp[k], glow = 0.5 + 0.5 * Math.sin(t * (1.3 + (q.ph % 1)) + q.ph);
      F.place(f, q.x, q.y, q.h, F.idle(t * 0.7, k, "sitphone"), { face: q.face, glow });
    });
    const p0 = s.t0 + (s.t1 - s.t0) * (d.from ?? 0.05), p1 = s.t0 + (s.t1 - s.t0) * (d.to ?? 0.6), p = K.eio(K.prog(t, p0, p1));
    const z = Math.exp(K.lerp(Math.log(2.6), Math.log(zEnd), p));
    // the room's middle ends at the middle of the frame (wide) or of the safe area (tall)
    const cx = K.lerp(hero.x, W / 2, p), cy = K.lerp(hero.y - hero.h * 0.5, V(H * 0.5, SAFE.y0 + 380 + (rows - 1) * 75 + (H / 2 - SAFE.y0 - SH * 0.42) / z), p);
    room.setAttribute("transform", `translate(${W / 2} ${H / 2}) scale(${z}) translate(${-cx} ${-cy})`);
    if (label) placeMask(label, W / 2, V(150, SAFE.y0 + 40), K.eout(K.prog(t, p1 - 0.3, p1 + 0.2)) * o);
    if (cnt) {
      const c0 = cueT(d.count, p1), k = K.eout(K.prog(t, c0, c0 + 1.6));
      cnt.t.textContent = (d.count.prefix || "") + fmtNum(d.count.value * k, 0) + (d.count.suffix || "");
      placeMask(cnt, W / 2, V(cntL ? 830 : 900, SAFE.y1 - 110), K.eout(K.prog(t, c0 - 0.1, c0 + 0.25)) * o);
      if (cntL) placeMask(cntL, W / 2, V(860 + READ + 20, SAFE.y1 - 50), K.eout(K.prog(t, c0 + 0.2, c0 + 0.5)) * o);
    }
  };
};


// ── a full illustrated panel (webtoon / motion comic): one composed image per beat, a real camera over it ──
// data: { image: "panels/p03.png", shot?: "EST"|"WIDE"|"MED"|"CU"|"ECU"|"INS"|"OTS"|"TWO", focus?: [x, y] (0..1 of the frame),
//         camera?: "push"|"pull"|"pan-left"|"pan-right"|"tilt-up"|"tilt-down"|"hold" | {from: {x, y, z}, to: {x, y, z}},
//         flashback?: true, caption_card?: "text" | {text, at?, hold?}, freeze?: true | {at}, shake?: {at, amp?},
//         enter?: "cut"|"fade", exit?: "cut"|"fade" }
// The camera crops and scales the still (z >= 1 keeps the frame covered); each shot type has a default move.
const SHOT_CAM = { EST: ["pull", 1.16, 1.0], WIDE: ["pan", 1.08, 1.08], MED: ["push", 1.02, 1.08], CU: ["push", 1.04, 1.13],
                   ECU: ["push", 1.08, 1.2], INS: ["push", 1.03, 1.1], OTS: ["pan", 1.1, 1.12], TWO: ["push", 1.0, 1.05] };
const PANEL_IMAGES = [];
function panelCam(d) {
  if (d.camera && typeof d.camera === "object") return d.camera;
  const [fx, fy] = d.focus || [0.5, 0.45], [def, z0, z1] = SHOT_CAM[d.shot] || ["push", 1.02, 1.08];
  let mv = d.camera || def;
  if (mv === "pan") mv = fx < 0.5 ? "pan-left" : "pan-right";
  const zp = Math.max(z0, z1, 1.08), dx = 0.05, c = { x: 0.5, y: 0.5 }, f = { x: fx, y: fy };
  switch (mv) {
    case "pull":      return { from: { ...f, z: Math.max(z0, z1) }, to: { ...c, z: Math.min(z0, z1) } };
    case "pan-left":  return { from: { x: 0.5 + dx, y: fy, z: zp }, to: { x: 0.5 - dx, y: fy, z: zp } };
    case "pan-right": return { from: { x: 0.5 - dx, y: fy, z: zp }, to: { x: 0.5 + dx, y: fy, z: zp } };
    case "tilt-up":   return { from: { x: fx, y: 0.5 + dx, z: zp }, to: { x: fx, y: 0.5 - dx, z: zp } };
    case "tilt-down": return { from: { x: fx, y: 0.5 - dx, z: zp }, to: { x: fx, y: 0.5 + dx, z: zp } };
    case "hold":      return { from: { ...f, z: 1.03 }, to: { ...f, z: 1.045 } };
    default:          return { from: { x: K.lerp(0.5, fx, 0.4), y: K.lerp(0.5, fy, 0.4), z: Math.min(z0, z1) }, to: { ...f, z: Math.max(z0, z1) } };

}
let fbVig = null;
B.panel = (s, g) => {
  const d = s.data || {}, id = "pf" + s.id.replace(/\W/g, "");
  PANEL_IMAGES.push(d.image);
  // grade: saturation (dropped on a freeze), then sepia for a flashback
  const flt = K.el("filter", { id, "color-interpolation-filters": "sRGB" }, K.defs);
  const sat = K.el("feColorMatrix", { type: "saturate", values: d.flashback ? 0.55 : 1 }, flt);
  if (d.flashback) K.el("feColorMatrix", { type: "matrix", values: ".393 .769 .189 0 0  .349 .686 .168 0 0  .272 .534 .131 0 0  0 0 0 1 0" }, flt);
  // the still keeps its 16:9 shape: a tall frame sees a third of it, and focus/camera choose which third
  const IW = V(W, H * 16 / 9), IH = H;
  K.el("rect", { x: 0, y: 0, width: IW, height: IH, fill: "#000" }, g);
  const img = K.el("image", { href: d.image, x: 0, y: 0, width: IW, height: IH, preserveAspectRatio: "xMidYMid slice", filter: `url(#${id})` }, g);
  void img;
  if (d.flashback) {
    if (!fbVig) {
      const gr = K.el("radialGradient", { id: "fbvig", cx: "50%", cy: "50%", r: "70%" }, K.defs);
      K.el("stop", { offset: "40%", "stop-color": "#1a1206", "stop-opacity": 0 }, gr);
      K.el("stop", { offset: "100%", "stop-color": "#1a1206", "stop-opacity": 0.75 }, gr);
      fbVig = true;
    }
    K.el("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#fbvig)" }, s.ov);
  }
  let card = null;
  if (d.caption_card) {
    const cc = typeof d.caption_card === "string" ? { text: d.caption_card } : d.caption_card;
    const c0 = cueT(cc, s.t0 + 0.15), c1 = cc.hold ? c0 + cc.hold : s.t1;
    const cg = K.el("g", {}, s.ov);
    const cs = READ, tx = K.text(cc.text, { "font-family": FONT, "font-size": cs, fill: "#f2ead8", x: 92, y: 66 + Math.round(cs * 1.25) }, cg);
    const bw = Math.max(260, cc.text.length * cs * 0.5 + 64);
    cg.insertBefore(K.el("rect", { x: 60, y: 66, width: bw, height: Math.round(cs * 1.75), rx: 4, fill: "#0d0c0a", "fill-opacity": 0.86, stroke: "#f2ead8", "stroke-opacity": 0.35 }, cg), tx);
    K.label(cc.text, c0, c1, "caption card");
    card = { g: cg, c0, c1 };
  }
  const cam = panelCam(d);
  const fz = d.freeze ? (d.freeze === true ? s.t1 - 0.6 : cueT(d.freeze, s.t1 - 0.6)) : null;
  const sh = d.shake ? { t: cueT(d.shake, s.t0), a: d.shake.amp || 14 } : null;
  return t => {
    const end = fz != null ? Math.min(fz, s.t1) : s.t1;
    const p = K.eio(K.prog(Math.min(t, end), s.t0, end));
    let z = Math.exp(K.lerp(Math.log(cam.from.z), Math.log(cam.to.z), p));
    z = Math.max(1, z);
    let cx = K.lerp(cam.from.x, cam.to.x, p) * IW, cy = K.lerp(cam.from.y, cam.to.y, p) * IH;
    if (sh && t >= sh.t) {
      const k = Math.exp(-(t - sh.t) * 7) * sh.a;
      cx += k * Math.sin((t - sh.t) * 71); cy += k * Math.sin((t - sh.t) * 53 + 1.3);

    g.__cam = { z, cx, cy };
    if (fz != null) K.set(sat, { values: (d.flashback ? 0.55 : 1) * K.lerp(1, 0.3, K.eout(K.prog(t, fz, fz + 0.25))) });
    const fin = d.enter === "fade" ? K.eout(K.prog(t, s.t0, s.t0 + 0.45)) : 1, fout = d.exit === "fade" ? 1 - K.ein(K.prog(t, s.t1 - 0.45, s.t1)) : 1;
    g.setAttribute("opacity", Math.min(fin, fout));
    if (card) card.g.setAttribute("opacity", K.eout(K.prog(t, card.c0, card.c0 + 0.25)) * (1 - K.ein(K.prog(t, card.c1 - 0.25, card.c1))));

};

// ── a captured screenshot: the real page or message from sources/captures.json, never a drawn stand-in ──
// data: { real: "<capture id>", frame?: "browser"|"phone"|"none", scroll?: [from, to] (0..1 of what overflows the window),
//         marks?: [{box: [x, y, w, h] (0..1 of the image), at?, label?}] }   (timeline adds image, iw, ih, url)
B.capture = (s, g) => {
  const d = s.data || {}, frame = d.frame || "browser", marks = d.marks || [];
  PANEL_IMAGES.push(d.image);
  const bar = frame === "browser" ? 56 : 0, pad = frame === "phone" ? 18 : 0;
  const bw = frame === "phone" ? V(560, 640) : V(1300, SAFE.x1 - SAFE.x0), maxH = frame === "phone" ? V(900, SH - 60) : V(740, SH - 60);
  const vw = bw - 2 * pad, sc = vw / (d.iw || 1), full = (d.ih || 1) * sc;
  const vh = Math.min(maxH - bar - 2 * pad, full), bh = vh + bar + 2 * pad;          // a short image shrinks the window to fit it
  const bx = W / 2 - bw / 2, by = V(H / 2, SMID) - bh / 2, vx = bx + pad, vy = by + bar + pad;
  const inner = K.el("g", {}, g), id = "cap" + s.id.replace(/\W/g, "");
  K.el("rect", { x: bx, y: by, width: bw, height: bh, rx: frame === "phone" ? 56 : 14, fill: frame === "none" ? "none" : frame === "phone" ? "#151515" : "#1d1d1f",
                 stroke: frame === "none" ? "none" : "#3a3a38", "stroke-width": 3 }, inner);
  if (bar) {
    [0, 1, 2].forEach(k => K.el("circle", { cx: bx + 28 + k * 22, cy: by + 28, r: 7, fill: "#3a3a38" }, inner));
    K.el("rect", { x: bx + 110, y: by + 12, width: bw - 140, height: 32, rx: 16, fill: "#2a2a2c" }, inner);
    K.text((d.url || "").replace(/^https?:\/\/(www\.)?/, "").replace(/[?#].*$/, ""), { ...AUX, "font-family": SANS, "font-size": 18, fill: C.GREY, x: bx + 130, y: by + 34 }, inner);
  }
  const clip = K.clipRect(id, vx, vy, vw, vh);
  if (frame === "phone") clip.setAttribute("rx", 40);
  const view = K.el("g", { "clip-path": `url(#${id})` }, inner);
  const img = K.el("image", { href: d.image, x: vx, y: vy, width: vw, height: full, preserveAspectRatio: "none" }, view);
  const ms = marks.map((m, k) => ({ m, T: cueT(m, revealAt(s, k, marks.length, 0.7, 0.6)),
    box: K.el("rect", { fill: "none", stroke: C.ACCENT, "stroke-width": 5, rx: 6 }, view),
    lab: m.label ? K.text(m.label, { "font-family": SANS, "font-size": READ, "font-weight": 700, fill: C.ACCENT }, view) : null }));
  K.label(`screenshot ${d.real || ""}`, s.t0, s.t1, "captured screenshot");
  marks.forEach(m => m.label && K.label(m.label, s.t0, s.t1, "screenshot mark"));
  const sr = d.scroll || [0, 0];

    const e = env(t, s), o = 1 - e.o;
    const off = Math.round((full - vh) * K.lerp(sr[0], sr[1], K.eio(K.prog(t, s.t0 + 0.4, s.t1 - 0.6))));   // a scroll steps whole pixels, so the page's text keeps its shape
    inner.setAttribute("transform", `translate(0 ${(1 - e.i) * 60})`); inner.setAttribute("opacity", e.i * o);
    K.set(img, { y: vy - off });
    ms.forEach(q => {
      const [mx, my, mw, mh] = q.m.box, p = Math.min(1.08, K.step(t, q.T, 14, 0.6));
      const x = vx + mx * vw, y = vy - off + my * full, w = mw * vw, h = mh * full;
      K.set(q.box, K.rect(x + w / 2 * (1 - p), y + h / 2 * (1 - p), w * Math.max(0, p), h * Math.max(0, p), 6));
      if (q.lab) { K.set(q.lab, { x, y: y + h + READ + 6 }); q.lab.style.opacity = K.prog(t, q.T + 0.15, q.T + 0.35); }
    });
    // the camera leans a little toward the newest mark (where it sat when it landed), never far enough to lose the window's edge
    const lean = (v, m) => Math.max(-m, Math.min(m, v));
    const keys = ms.map(q => { const [mx, my, mw, mh] = q.m.box, at = (full - vh) * K.lerp(sr[0], sr[1], K.eio(K.prog(q.T, s.t0 + 0.4, s.t1 - 0.6)));
      return [q.T, lean((vx + (mx + mw / 2) * vw - W / 2) * 0.3, 80), lean((vy - at + (my + mh / 2) * full - (by + bh / 2)) * 0.3, 50)]; });

const OPAQUE = new Set(["stage", "board", "crowd"]);   // scenes with their own set: no drifting dots behind them
const FULL = new Set(["panel"]);                       // full-frame images: they cut (or fade), and nothing shows behind them

// ── build every segment once ─────────────────────────────
const built = SEGS.map((s, i) => {
  const g = K.el("g", {}, sceneG);
  s.ov = K.el("g", {}, overlayG);
  const fn = (B[s.type] || B.statement)(s, g);
  // scenes with their own set wipe on and off (left to right, 0.45 s) instead of cutting: no hard pops, no fades
  let wipe = null;
  if (OPAQUE.has(s.type)) {
    const id = "wipe" + i; wipe = K.clipRect(id, 0, -50, 0, H + 100); g.setAttribute("clip-path", `url(#${id})`);
    g.insertBefore(K.el("rect", { x: -400, y: -400, width: W + 800, height: H + 800, fill: C.BG }, g), g.firstChild);   // paints every pixel
  }
  return { s, g, fn, wipe, next: SEGS[i + 1] };
});
const WIPE = 0.45;

// ── burned-in captions (optional, "captions": true): word-lit pages built from the aligned words ──
// Long-form 16:9 usually ships captions as a YouTube caption track (out/captions.vtt) instead; burn them for shorts.
const capPages = [];
if (TL.captions) {
  const capsDiv = document.getElementById("caps");
  SEGS.forEach(s => {
    const ws = s.words || [];
    let page = [];
    const flush = () => { if (page.length) capPages.push({ s, words: page }); page = []; };
    ws.forEach((w, k) => {
      page.push(w);
      const chars = page.map(x => x[0]).join(" ").length, end = /[.!?]$/.test(w[0]), comma = /[,;:]$/.test(w[0]);
      // short pages (about four words) so the eye can't run ahead of the voice
      if (end || page.length >= 4 || chars > 26 || (comma && page.length >= 2)) flush();
    });
    flush();
  });
  capPages.forEach((pg, i) => {
    const next = capPages[i + 1];
    pg.t0 = pg.words[0][1] - 0.05;
    pg.t1 = next && next.s === pg.s ? next.words[0][1] - 0.05 : Math.min(pg.s.t1, pg.words[pg.words.length - 1][2] + 0.5);
    const box = document.createElement("div"), inner = document.createElement("div");
    const ch = V(64, 84);
    Object.assign(box.style, { position: "absolute", left: V(80, 60) + "px", width: (W - V(160, 120)) + "px", top: V(H - 128, SAFE.y1 + 40) + "px", height: ch + "px", overflow: "hidden", textAlign: "center",
      fontFamily: SANS, fontSize: V(44, 60) + "px", fontWeight: "600", lineHeight: ch + "px", fontStyle: pg.s.mono ? "italic" : "normal" });
    pg.spans = pg.words.map(w => { const sp = document.createElement("span"); sp.textContent = w[0] + " "; sp.style.whiteSpace = "pre"; inner.appendChild(sp); return sp; });
    box.appendChild(inner); capsDiv.appendChild(box);
    pg.box = box; pg.inner = inner;
    window.STUDIO.text.push({ t0: pg.t0, t1: pg.t1, where: "caption", text: pg.words.map(w => w[0]).join(" ") });
  });
}

// vignette: a radial darkening over the scenes, under the captions (grade.vignette 0 turns it off)
const vig = (() => {
  const amt = (TL.grade && TL.grade.vignette != null) ? TL.grade.vignette : 0.35;
  if (!amt) return null;
  const gr = K.el("radialGradient", { id: "vig", cx: "50%", cy: "50%", r: "75%" }, K.defs);
  K.el("stop", { offset: "55%", "stop-color": "#000", "stop-opacity": 0 }, gr);
  K.el("stop", { offset: "100%", "stop-color": "#000", "stop-opacity": amt }, gr);
  return K.el("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#vig)" }, K.top);
})();
void vig;

// panel images must be decoded before a frame is taken (render.py waits on STUDIO.ready)
window.STUDIO.ready = Promise.all([...new Set(PANEL_IMAGES.filter(Boolean))].map(src => {
  const im = new Image(); im.src = src;
  return im.decode().catch(() => { (window.STUDIO.warnings = window.STUDIO.warnings || []).push(`panel image missing or unreadable: ${src}`); });
}));

// ── render(t) ────────────────────────────────────────────
K.run(t => {
  dots.forEach(d => K.set(d.el, { cx: (d.x + t * d.v) % W, cy: d.y, r: d.s }));
  K.show(bgG, !built.some(b => (OPAQUE.has(b.s.type) && t >= b.s.t0 + WIPE && t <= b.s.t1) || (FULL.has(b.s.type) && t >= b.s.t0 && t <= b.s.t1)));
  let src = "", chap = "";
  built.forEach(b => {
    const on = t >= b.s.t0 - 0.01 && t <= b.s.t1 + 0.01 + (b.wipe ? WIPE : 0);
    K.show(b.g, on); K.show(b.s.ov, on && t <= b.s.t1 + 0.01);
    if (on) {
      b.fn(t);
      // the scene's own camera if it set one. No slow zoom drift otherwise: text re-rasterised at a new scale every frame
      // shimmers (line gaps jitter by up to 2 px), and an unscaled pan lands on whole pixels so its text keeps its shape, unless
      // the scene asks for fractional steps (cam.frac: a stage pan, whose slow ease would otherwise step)
      const cam = b.g.__cam, z = cam ? cam.z : 1, cx = cam ? cam.cx : W / 2, cy = cam ? cam.cy : H / 2;
      const tx = cam && cam.frac ? +(W / 2 - cx).toFixed(2) : Math.round(W / 2 - cx), ty = cam && cam.frac ? +(H / 2 - cy).toFixed(2) : Math.round(H / 2 - cy);
      b.g.setAttribute("transform", z === 1 ? `translate(${tx} ${ty})` : `translate(${W / 2} ${H / 2}) scale(${z}) translate(${-cx} ${-cy})`);
      if (b.wipe) {
        // the wipe is laid out on the frame and mapped into the scene's own coordinates, which the camera moves: drawn in scene
        // coordinates, a pan wider than its pad left a strip at the frame's edge unpainted
        const inn = K.eio(K.prog(t, b.s.t0, b.s.t0 + WIPE)), out = !b.next || !OPAQUE.has(b.next.type) ? K.eio(K.prog(t, b.s.t1, b.s.t1 + WIPE)) : 0;
        const pad = 200, sx = -pad + out * (W + 2 * pad), sw = Math.max(0, (W + 2 * pad) * (inn - out)), sy = -pad, sh = H + 2 * pad;
        K.set(b.wipe, z === 1 ? { x: sx - tx, width: sw, y: sy - ty, height: sh }
                              : { x: (sx - W / 2) / z + cx, width: sw / z, y: (sy - H / 2) / z + cy, height: sh / z });
      }
      src = b.s.source || ""; chap = FULL.has(b.s.type) || VERT ? "" : b.s.chapter || "";   // a drama panel (and a Short) carries no chapter label
    }
  });
  sourceT.textContent = src ? "Source: " + src : "";
  chapterT.textContent = chap.toUpperCase();
  capPages.forEach(pg => {
    // a page leaves in the 0.18 s before the next one rises, so two pages never share the band
    const vis = t >= pg.t0 && t < pg.t1;
    pg.box.style.visibility = vis ? "visible" : "hidden";
    if (!vis) return;
    const up = K.eout(K.prog(t, pg.t0, pg.t0 + 0.12)), gone = K.ein(K.prog(t, pg.t1 - 0.1, pg.t1));
    pg.inner.style.transform = `translateY(${(1 - up) * 100 - gone * 100}%)`;
    pg.spans.forEach((sp, k) => {
      const w = pg.words[k], nx = pg.words[k + 1], lit = K.prog(t, w[1] - 0.02, w[1] + 0.08);
      const now = t >= w[1] - 0.02 && (!nx || t < nx[1] - 0.02) && t < w[2] + 0.15;   // one word at a time, lit as it is said
      sp.style.color = now ? C.ACCENT : K.mix("#6b6b67", pg.s.mono ? "#e9dcc0" : C.INK, lit);   // inner monologue reads warmer
    });
  });
});
</script>
